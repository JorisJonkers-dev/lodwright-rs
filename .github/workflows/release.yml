# release-please keeps a release pull request open; merging it tags vX.Y.Z, writes CHANGELOG.md and bumps the
# version in Cargo.toml and Cargo.lock (release-please-config.json). Nothing is published: no crates.io, no
# registry. Each release gets the Linux x86_64 binary, the contract schemas and a SHA-256 file as release assets,
# with a build provenance attestation over all of them (scripts/release-assets.sh, VERSIONING.md).
# `workflow_dispatch` is the dry run: it builds and attests the same assets from the selected ref and keeps them as a
# workflow artifact instead of a release. With `tag` and `publish` it republishes that existing tag: its assets and OCI
# package are pushed again.
name: Release

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/release.yml
  workflow_dispatch:
    inputs:
      tag:
        description: An existing release tag, vX.Y.Z. Empty runs the dry run from the selected ref
        required: false
        type: string
      publish:
        description: Publish the tag's assets and package (false is a dry run)
        required: false
        default: false
        type: boolean

# Each job asks for what it needs; the workflow itself holds nothing.
permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      # Author the release PR with the personal-stack-agents App token (not the
      # default GITHUB_TOKEN) so CI runs on the PR without a manual approval
      # gate. Best-effort: falls back to GITHUB_TOKEN when the App secrets or
      # installation are absent.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        continue-on-error: true
        with:
          permission-contents: write
          permission-pull-requests: write
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please cannot edit Cargo.lock: its JSONPath filters match nothing in an array of tables. Without
      # the lock bump the release PR fails every `--locked` build. So refresh the workspace members' own entries
      # on the release branch, with the App token so that CI runs on the new commit.
      - if: ${{ steps.rp.outputs.pr != '' && steps.rp.outputs.pr != 'null' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(steps.rp.outputs.pr || '{}').headBranchName }}
          persist-credentials: false
      - if: ${{ steps.rp.outputs.pr != '' && steps.rp.outputs.pr != 'null' }}
        name: Refresh the lock entries of the workspace crates
        env:
          PUSH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ fromJSON(steps.rp.outputs.pr || '{}').headBranchName }}
        run: |
          set -euo pipefail
          cargo update --workspace
          cargo update --workspace --manifest-path fuzz/Cargo.toml
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): refresh the workspace lock entries"
          git push "https://x-access-token:${PUSH_TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/${BRANCH}"

  assets:
    needs: release-please
    # After a release is created from main, or on demand for the dry run.
    if: ${{ !cancelled() && ((github.event_name == 'push' && needs.release-please.outputs.release_created == 'true') || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || needs.release-please.outputs.tag_name || github.ref }}
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          cache: true
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target"
          save-if: false
      - name: Build the assets
        run: mise exec -- scripts/release-assets.sh dist
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Upload to the release
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.tag != '' && inputs.publish) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
      - name: Keep the assets of a dry run
        if: ${{ github.event_name == 'workflow_dispatch' && !(inputs.tag != '' && inputs.publish) }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets-dry-run
          path: dist/
          retention-days: 7

  # The binary of the release as an OCI package on ghcr.io, as the Toolbox's packages ADR decides:
  # ghcr.io/jorisjonkers-dev/lodwright-rs:<version>-x86_64-unknown-linux-gnu. The binary is the one just
  # attached to the release (and attested there). The archive is checked before it is pushed, its digest is attested in
  # the registry, and the job then pulls the digest anonymously and compares its SHA-256, so a package that is not
  # public fails the release. The repository variable LODWRIGHT_FIRST_PACKAGE_PUSH=true skips only that pull, for the
  # first push of a new package (ghcr.io creates it private; make it public, then remove the variable).
  packages:
    needs: [release-please, assets]
    if: ${{ !cancelled() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.tag != '' && inputs.publish)) && needs.assets.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # add the package reference to the release notes
      packages: write
      id-token: write
      attestations: write
    env:
      TAG_NAME: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OUT: packages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - name: Install oras
        # The repository allows only listed actions, so oras comes from its release, checked by SHA-256.
        env:
          ORAS_VERSION: 1.4.0
          ORAS_SHA256: d8e1dce2fd8ce996f1d901845b688eb0cf505a6082897606f053825bb47935d1
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/oras.tar.gz" "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          echo "${ORAS_SHA256}  $RUNNER_TEMP/oras.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/oras"
          tar -xzf "$RUNNER_TEMP/oras.tar.gz" -C "$RUNNER_TEMP/oras" oras
          echo "$RUNNER_TEMP/oras" >> "$GITHUB_PATH"
      - name: Build the archive
        run: |
          set -euo pipefail
          mkdir -p "$OUT/stage" binaries
          gh release download "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --pattern lodwright-x86_64-unknown-linux-gnu --dir binaries
          install -m 0755 binaries/lodwright-x86_64-unknown-linux-gnu "$OUT/stage/lodwright"
          cp LICENSE "$OUT/stage/"
          tar -czf "$OUT/lodwright-x86_64-unknown-linux-gnu.tar.gz" -C "$OUT/stage" .
          tar -tzf "$OUT/lodwright-x86_64-unknown-linux-gnu.tar.gz" >/dev/null
          "$OUT/stage/lodwright" --version
          rm -rf "$OUT/stage"
          sha256sum "$OUT/lodwright-x86_64-unknown-linux-gnu.tar.gz" | awk '{print $1}' > "$OUT/sha256"
          ls -l "$OUT"
      - name: Push the package
        id: push
        env:
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          # The commit the tag points at (the job checked the tag out), also when the workflow runs from main.
          REVISION="$(git rev-parse HEAD)"
          VERSION="${TAG_NAME#v}"
          ref="ghcr.io/jorisjonkers-dev/lodwright-rs:${VERSION}-x86_64-unknown-linux-gnu"
          echo "$GH_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          (cd "$OUT" && oras push "$ref" lodwright-x86_64-unknown-linux-gnu.tar.gz \
            --annotation "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --annotation "org.opencontainers.image.revision=${REVISION}" \
            --annotation "org.opencontainers.image.licenses=GPL-3.0-only")
          digest="$(oras resolve "$ref")"
          printf '%s' "$digest" > "$OUT/digest"
          echo "pushed $ref $digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest the package
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/jorisjonkers-dev/lodwright-rs
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      # The attestation above is pushed with the login of the push step; the pull below is anonymous.
      - name: Log out of the registry
        run: oras logout ghcr.io
      - name: Verify the package is public
        if: ${{ vars.LODWRIGHT_FIRST_PACKAGE_PUSH != 'true' }}
        run: |
          set -euo pipefail
          digest="$(cat "$OUT/digest")"
          sha="$(cat "$OUT/sha256")"
          rm -rf "$OUT/pull"
          mkdir -p "$OUT/pull"
          oras pull "ghcr.io/jorisjonkers-dev/lodwright-rs@${digest}" -o "$OUT/pull"
          pulled="$(sha256sum "$OUT/pull/lodwright-x86_64-unknown-linux-gnu.tar.gz" | awk '{print $1}')"
          echo "pulled $pulled (expected $sha)"
          test "$pulled" = "$sha"
      - name: Record the package reference
        run: |
          set -euo pipefail
          VERSION="${TAG_NAME#v}"
          summary="$(mktemp)"
          {
            echo "## OCI packages"
            echo
            echo "| Name | Tag | Digest | Archive SHA-256 |"
            echo "| --- | --- | --- | --- |"
            echo "| ghcr.io/jorisjonkers-dev/lodwright-rs | ${VERSION}-x86_64-unknown-linux-gnu | $(cat "$OUT/digest") | $(cat "$OUT/sha256") |"
          } > "$summary"
          cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          notes="$(mktemp)"
          { gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json body --jq .body; printf '\n'; cat "$summary"; } > "$notes"
          gh release edit "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --notes-file "$notes"

  # On a pull request that changes this workflow: build the archive from the checked-out source and print what a
  # release would push, without logging in to a registry and without any write permission.
  packages-dry-run:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: JorisJonkers-dev/github-workflows/actions/setup-package-proxy@8e402cc4904be3f6bdb53bad3d9b5d7951bed491 # v0.50.3
        with:
          token: ${{ secrets.PACKAGES_PROXY_TOKEN }}
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          cache: true
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target"
          save-if: false
      - name: Build the archive
        env:
          OUT: packages
        run: |
          set -euo pipefail
          mise exec -- cargo build --release --locked -p lodwright-cli
          mkdir -p "$OUT/stage"
          install -m 0755 target/release/lodwright "$OUT/stage/lodwright"
          cp LICENSE "$OUT/stage/"
          tar -czf "$OUT/lodwright-x86_64-unknown-linux-gnu.tar.gz" -C "$OUT/stage" .
          tar -tzf "$OUT/lodwright-x86_64-unknown-linux-gnu.tar.gz" >/dev/null
          "$OUT/stage/lodwright" --version
      - name: Print what would be pushed
        env:
          OUT: packages
        run: |
          set -euo pipefail
          echo "Would push: ghcr.io/jorisjonkers-dev/lodwright-rs:0.0.0-dry-run-x86_64-unknown-linux-gnu"
          echo "Archive SHA-256: $(sha256sum "$OUT/lodwright-x86_64-unknown-linux-gnu.tar.gz" | awk '{print $1}')"
