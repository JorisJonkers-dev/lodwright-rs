[workspace]
resolver = "3"
members = [
    "crates/lodwright-assets",
    "crates/lodwright-core",
    "crates/lodwright-dds",
    "crates/lodwright-gen",
    "crates/lodwright-nif",
    "crates/lodwright-plugin-meta",
    "crates/lodwright-contract",
    "crates/lodwright-api",
    "crates/lodwright-cli",
    "crates/lodwright-testkit",
    "xtask",
]
# fuzz/ is its own workspace (libfuzzer-sys stays out of the shipped crates).
exclude = ["fuzz"]

[workspace.package]
version = "0.4.2"
edition = "2024"
rust-version = "1.100"
license = "GPL-3.0-only"
repository = "https://github.com/JorisJonkers-dev/lodwright-rs"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[workspace.dependencies]
lodwright-assets = { path = "crates/lodwright-assets" }
lodwright-core = { path = "crates/lodwright-core" }
lodwright-dds = { path = "crates/lodwright-dds" }
lodwright-gen = { path = "crates/lodwright-gen" }
lodwright-contract = { path = "crates/lodwright-contract" }
lodwright-api = { path = "crates/lodwright-api" }
lodwright-nif = { path = "crates/lodwright-nif" }
lodwright-testkit = { path = "crates/lodwright-testkit" }
lodwright-plugin-meta = { path = "crates/lodwright-plugin-meta" }
