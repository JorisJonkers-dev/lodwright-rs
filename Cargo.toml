[workspace]
resolver = "3"
members = ["crates/lodwright-core", "crates/lodwright-cli", "crates/lodwright-testkit"]
# fuzz/ is its own workspace (libfuzzer-sys stays out of the shipped crates).
exclude = ["fuzz"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MPL-2.0"
repository = "https://github.com/JorisJonkers-dev/lodwright-rs"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[workspace.dependencies]
lodwright-core = { path = "crates/lodwright-core" }
lodwright-testkit = { path = "crates/lodwright-testkit" }
