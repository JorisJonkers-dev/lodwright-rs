# `task check` is the set of checks the pipeline runs, one job per task target (Pipeline Complete aggregates them), so
# local and CI cannot drift.
version: "3"

vars:
  COVERAGE_MIN: "80"

tasks:
  default:
    cmd: task --list
    silent: true

  fmt:
    desc: Check formatting
    cmd: cargo fmt --all -- --check

  clippy:
    desc: Clippy with warnings denied
    cmd: cargo clippy --locked --workspace --all-targets -- -D warnings

  test:
    desc: "Tests through cargo-nextest (profile ci, which writes JUnit for the feature catalogue) and the line-coverage gate ({{.COVERAGE_MIN}}%)"
    cmds:
      - cargo test --locked --workspace --doc
      - cargo llvm-cov nextest --locked --workspace --profile ci --fail-under-lines {{.COVERAGE_MIN}}

  bench:
    desc: The timing guard of the hot steps (release build, synthetic data); LODWRIGHT_BENCH=print prints the ratios
    cmd: cargo test --locked --release -p lodwright-api --test step_bench -- --ignored --test-threads=1

  fuzz:check:
    desc: The fuzz harnesses compile (stable, type-check only; running them needs nightly and cargo-fuzz)
    cmd: |
      cargo check --locked --manifest-path fuzz/Cargo.toml || {
        echo "If the error says the lock file needs updating, fuzz/Cargo.lock is stale (a dependency moved in the root manifest)." >&2
        echo "Regenerate it with: cargo metadata --manifest-path fuzz/Cargo.toml > /dev/null   then commit fuzz/Cargo.lock" >&2
        exit 1
      }

  deny:
    desc: Licences, bans, sources and advisories (deny.toml), for the workspace and the fuzz workspace
    cmds:
      - cargo deny --locked check
      - cargo deny --locked --manifest-path fuzz/Cargo.toml check

  secrets:
    desc: Scan every commit for secrets
    cmd: gitleaks git --redact --no-banner --config .gitleaks.toml .

  lint:actions:
    desc: actionlint and zizmor on every workflow
    cmds:
      - actionlint
      - zizmor --offline --no-progress .github/workflows/

  guards:
    desc: Clean-room guards on the whole tree (SPDX headers, provenance references, game-data guard, .gitignore, retired name)
    cmd: cargo xtask guards all

  scripts:
    desc: Self-tests of the repository tasks in xtask/ (throwaway git repositories, no network)
    cmd: cargo test --locked -p xtask

  check:
    desc: Everything the pipeline runs on a pull request
    cmds:
      - task: fmt
      - task: clippy
      - task: test
      - task: fuzz:check
      - task: deny
      - task: secrets
      - task: lint:actions
      - task: guards
      - task: scripts
