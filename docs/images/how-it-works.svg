<text x="399.99999999999994" y="47" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#F59E3B" font-weight="bold" text-anchor="middle">lodwright-rs</text>
<text x="399.99999999999994" y="71" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#E6E8EB" font-weight="normal" text-anchor="middle">builds the far view</text>
<text x="399.99999999999994" y="91" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#98A1AC" font-weight="normal" text-anchor="middle">on your own PC</text>
