[package]
name = "lodwright-fuzz"
version = "0.0.0"
edition = "2024"
license = "MPL-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
lodwright-assets = { path = "../crates/lodwright-assets" }
lodwright-core = { path = "../crates/lodwright-core" }
lodwright-dds = { path = "../crates/lodwright-dds" }
lodwright-nif = { path = "../crates/lodwright-nif" }
lodwright-testkit = { path = "../crates/lodwright-testkit" }

# Own workspace root: keeps libfuzzer-sys out of the shipped crates and the root lockfile.
[workspace]

[profile.release]
debug = 1

[lints.rust]
unsafe_code = "forbid"

[[bin]]
name = "plugin_records"
path = "fuzz_targets/plugin_records.rs"
test = false
doc = false
bench = false

