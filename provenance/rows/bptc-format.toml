[[source]]
id = "bptc-format"
fact = "BC7 (BPTC) block layout: a 16-byte block read from its least significant bit; the mode is the number of zero bits before the first one bit (none: reserved, decoded as transparent black). Per mode (subsets, partition bits, rotation bits, index selection bits, colour bits, alpha bits, p-bits per endpoint or shared per subset, index bits, secondary index bits): 0 (3,4,0,0,4,0,endpoint,3,0), 1 (2,6,0,0,6,0,shared,3,0), 2 (3,6,0,0,5,0,none,2,0), 3 (2,6,0,0,7,0,endpoint,2,0), 4 (1,0,2,1,5,6,none,2,3), 5 (1,0,2,0,7,8,none,2,2), 6 (1,0,0,0,7,7,endpoint,4,0), 7 (2,6,0,0,5,5,endpoint,2,0). After the mode, partition, rotation and index selection come the red values of every endpoint (subset 0 endpoint 0, endpoint 1, subset 1 ...), then green, blue and alpha alike, then the p-bits, then the indices texel by texel (y-major), the secondary indices after the primary ones. A p-bit is appended below an endpoint value; the value is widened to 8 bits by repeating its top bits; no alpha bits means alpha 255. The anchor texel of each subset (texel 0 for subset 0; per partition from the anchor tables otherwise) stores one index bit fewer. Interpolation: ((64 - w) * e0 + w * e1 + 32) >> 6 with weights 0 21 43 64 (2-bit), 0 9 18 27 37 46 55 64 (3-bit), 0 4 9 13 17 21 26 30 34 38 43 47 51 55 60 64 (4-bit). Colour takes the secondary index and alpha the primary when the index selection bit is 1, else the reverse; rotation 1, 2, 3 swaps alpha with red, green, blue afterwards. The 64 two-subset and 64 three-subset partition tables and the three anchor tables are the ones in crates/lodwright-dds/src/bc7.rs."
url = "https://registry.khronos.org/DataFormat/specs/1.3/dataformat.1.3.html"
licence = "Khronos Data Format Specification v1.3.1 licence: use of the specification for implementing the functionality therein is permitted; the text is not reproduced"
date = 2026-11-22
recorded_by = "J.W. Jonkers"
role = "specifier"
verified = false
note = "Read from section 'BC7' of the Khronos Data Format Specification v1.3.1 (tables of mode parameters, bit layout, partition tables for two and three subsets, anchor index tables, interpolation factors, rotation) and checked against Microsoft's BC7 format page (https://learn.microsoft.com/en-us/windows/win32/direct3d11/bc7-format, CC-BY-4.0). The page has no code; none copied. The partition and anchor tables were taken over as data and checked: in every partition texel 0 is in subset 0 and each anchor texel lies in its own subset. The two-subset table also equals the BC6H one of the same section. Not second-read."
