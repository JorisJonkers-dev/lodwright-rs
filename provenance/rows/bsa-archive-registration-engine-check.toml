[[source]]
id = "bsa-archive-registration-engine-check"
fact = "In the engine port the Toolbox ships, a packed archive named like a stub plugin is opened and read when the stub is in plugins.txt and has a master; a stub with no master registers nothing. Measured 2026-11-21 in a scratch copy of the game folder (symbolic links to the install, Data with the generated files added) through the engine port's bench scenario 'views', with strace on the file calls: archive 'Lodwright LOD.bsa' (354 MB, 4,384 files of the world WastelandNV, generated by lodwright from the game data in place, every record hash and the record order checked by an independent decoder) next to 'Lodwright LOD.esp'. (1) Stub without a master: the stub is read as a plugin (header parsed on three threads), the archive is opened 0 times, while the archive of a game DLC plugin is opened (209 trace lines). (2) Stub with the master FalloutNV.esm and its size: the archive is opened and read 1,281 times, engine log 0 error lines, 0 wgpu errors, 0 stops, 5 fixed views captured. (3) The same with the generated files also present loose in Data: the archive is opened and read once (the index), engine log 0 error lines: the loose files are used (precedence variant). Settings: the install's own Fallout.ini defaults ([Archive] bInvalidateOlderFiles=1, bUseArchives=1 as in the install), no JIP LN .override file, plugins.txt with the one line 'Lodwright LOD.esp' (load-order position last; the DLC plugins are active through their .nam files)."
url = "oracle:engine-bench-archive-load"
licence = "Own measurement: file-call counts and log counts of a run on the owner's own game data, no content recorded"
date = 2026-11-21
recorded_by = "J.W. Jonkers"
role = "specifier"
verified = false
note = "Engine: the cached nv-viewer of the engine port's checkout at v0.18.1 plus six commits (binary built 2026-11-21 03:03), not the Toolbox bundle; the Toolbox pins v0.18.2, whose archive code was not compared. The rule that only a plugin with a master lists its archives was read, afterwards, in the engine's translation of the game's data handler (its tesdatahandler.rs, fn_00463070 step 3; code read only to explain a measurement, nothing copied) to explain the first result; the measurement is the strace count, not the source. NOT measured and not claimed: the original game through Proton; that the distant land shown comes from this archive and not from the game's own LOD archive (the pictures cannot tell them apart; the reads on the archive can); the case with a loose texture mod over the same paths beyond the loose copies above. Two things stay open: the bench reports 'the player landed' FAIL (fell 8395 units, near ground missing in the pictures) in runs (2) and (3), and no clean control exists: the vanilla scratch folder without the archive (five runs: no plugin line, empty plugins.txt, stub only, archive only, with and without strace) stops in frame 2 with 'a real thread's engine used on a second OS thread (in 0086a850)', an engine defect found here and not related to archives; so whether the missing near ground comes from the plugin, the archive or the scratch folder is not settled. Not second-read."
