[[source]]
id = "bsa-name-hash-rules"
fact = "The inputs of the BSA name hash, as the UESP page 'Hash Calculation' states them in prose: names are lower case with backslashes (a forward slash must be changed to a backslash); a folder hash is taken over the folder name with no leading or trailing separator; a folder name that contains a dot (the page's example ends in .esm) is not split at the dot; for a file the hashed stem is the file name with no folder and no extension, and the extension keeps its dot."
url = "https://en.uesp.net/wiki/Tes4Mod:Hash_Calculation"
licence = "CC-BY-SA-2.5 (UESP wiki footer: 'Attribution-ShareAlike 2.5 License'); only the prose rules are used"
date = 2026-11-21
recorded_by = "J.W. Jonkers"
role = "specifier"
verified = false
note = "Read from the Internet Archive copy of the page (the live site answers HTTP 403 to automated reads), snapshot of 2018-08-13. The page has no worked hash value and no test vector; the numbers are in bsa-name-hash-vectors. The page also embeds code samples under other licences (MPL, GPL); none of that code is an input here and the writer was not written from it: the hash is written from the xEdit-derived row bsa-name-hash, which the samples were not used to change. The reader of this page saw those samples before writing the hash function, so a second reader who has not read them should re-derive the hash from bsa-name-hash and bsa-name-hash-vectors. Not second-read."
