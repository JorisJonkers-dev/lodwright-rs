[[source]]
id = "bsa-name-hash-rules"
fact = "The inputs of the BSA name hash, as the UESP page 'Hash Calculation' states them in prose: names are lower case with backslashes (a forward slash must be changed to a backslash); a folder hash is taken over the folder name with no leading or trailing separator; a folder name that contains a dot (the page's example ends in .esm) is not split at the dot; for a file the hashed stem is the file name with no folder and no extension, and the extension keeps its dot."
url = "https://web.archive.org/web/20180813064005/http://en.uesp.net/wiki/Tes4Mod:Hash_Calculation"
licence = "CC-BY-SA-2.5 (UESP wiki footer: 'Attribution-ShareAlike 2.5 License'); only the prose rules are used"
date = 2026-11-21
recorded_by = "J.W. Jonkers"
role = "specifier"
verified = false
note = "Source record (exact): the page was read through the Internet Archive copy https://web.archive.org/web/20180813064005/http://en.uesp.net/wiki/Tes4Mod:Hash_Calculation (snapshot of 2018-08-13) on 2026-11-21, because the live site answers HTTP 403 to automated reads; that route is not yet accepted by the owner and no further page is read that way. The page's embedded code samples (C, Python, C++ and C#, under other licences) were seen and not copied: the hash code of lodwright-assets was written from the prose rules and from the row bsa-name-hash, and checked against name and hash numbers measured on the owner's own archives (bsa-name-hash-vectors, oracle, numbers only). No line of the writer is taken from those samples. Read the prose only. The Internet Archive copy of the Skyrim archive page (snapshot 2025-01-08, https://web.archive.org/web/20250108220733/https://en.uesp.net/wiki/Skyrim_Mod:Archive_File_Format) was also opened that day and nothing was taken from it beyond what the existing bsa-v104 rows already say. Not second-read."
