[[source]]
id = "bsa-name-hash-rules"
fact = "The inputs of the BSA name hash, as the UESP page 'Hash Calculation' states them in prose: names are lower case with backslashes (a forward slash must be changed to a backslash); a folder hash is taken over the folder name with no leading or trailing separator; a folder name that contains a dot (the page's example ends in .esm) is not split at the dot; for a file the hashed stem is the file name with no folder and no extension, and the extension keeps its dot."
url = "https://en.uesp.net/wiki/Oblivion_Mod:Hash_Calculation"
licence = "CC-BY-SA-2.5 (UESP wiki footer: 'Attribution-ShareAlike 2.5 License'); only the prose rules are used"
date = 2026-11-21
recorded_by = "J.W. Jonkers"
role = "specifier"
verified = true
note = "Source record (exact): the page was read through the Internet Archive copy https://web.archive.org/web/20180813064005/http://en.uesp.net/wiki/Tes4Mod:Hash_Calculation (snapshot of 2018-08-13) on 2026-11-21, because the live site answers HTTP 403 to automated reads; that route is not yet accepted by the owner and no further page is read that way. The page's embedded code samples (C, Python, C++ and C#, under other licences) were seen and not copied: the hash code of lodwright-assets was written from the prose rules and from the row bsa-name-hash, and checked against name and hash numbers measured on the owner's own archives (bsa-name-hash-vectors, oracle, numbers only). No line of the writer is taken from those samples. Read the prose only. The Internet Archive copy of the Skyrim archive page (snapshot 2025-01-08, https://web.archive.org/web/20250108220733/https://en.uesp.net/wiki/Skyrim_Mod:Archive_File_Format) was also opened that day and nothing was taken from it beyond what the existing bsa-v104 rows already say. Not second-read. Current text of the page (last edited 8 January 2021) agrees with the 2018-08-13 snapshot reading on all four points. 'Forward slashes must be changed to backslashes and upper case characters must be converted to lower case.' 'Folder hash values must not include leading or trailing slashes.' A folder name with an extension, the page's example ends in skyrim.esm and a slash, 'must not be treated as a file extension in the calculation'. The file name substring 'must be only the filename with no slashes or extension' and 'The extension must include the '.''. No test vector (a name with its hash value) is given anywhere on the page. The page is headed Oblivion Mod and says its hash serves 'Tes4Mod and Tes5Mod archive formats'; Fallout 3 and New Vegas are not named. The page has code samples (C, Python, C++ from BSAOpt, C#); they were read to check what the prose says and nothing was copied; the 2018 snapshot predates the page's last edit, and the saved text confirms it."
