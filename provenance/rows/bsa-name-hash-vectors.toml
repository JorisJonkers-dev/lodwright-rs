verified = false
note = "Measured 2026-11-21 with a throwaway script (not in the repository) that wrote the hash of bsa-name-hash independently of the Rust code and compared it with every folder and file record of Fallout - Meshes.bsa, Fallout - Textures.bsa, Fallout - Textures2.bsa, Fallout - Misc.bsa and Update.bsa: 20665, 11993, 10863, 152 and 108 records, 0 differences. Ascending order held in all five (folders, and files within each folder). This is the public-test-vector evidence the hash row waited for (issue 124); the writer's tests use the pairs above. Not second-read."
