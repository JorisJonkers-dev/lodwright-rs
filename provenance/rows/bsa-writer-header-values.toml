[[source]]
id = "bsa-writer-header-values"
fact = "Header values of the game's own v104 archives, read as numbers. Archive flags: Fallout - Meshes.bsa 0x87, Fallout - Textures.bsa and Fallout - Textures2.bsa 0x107, Fallout - Misc.bsa 0x7, Update.bsa 0x83 (all have 0x3 for folder and file names; 0x4 compressed by default is set in all but Update.bsa; 0x100 embedded names only in the texture archives; 0x80 in the meshes archive and Update.bsa). File flags (the u16 after the file-name length, the content type of the UESP page 'BSA File Format' for Oblivion: 0x1 meshes, 0x2 textures, 0x100 miscellaneous): meshes archive 0x41 (meshes and trees), both texture archives 0x2, Misc.bsa 0x100, Update.bsa 0x11b. The writer sets archive flags 0x3 plus 0x4 when most files are compressed, never 0x100, and file flags 0x1 for .nif, .btr and .bto, 0x2 for .dds and 0x100 for any other extension; whether the game needs more (0x80, 0x40) is not known."
url = "oracle:game-bsa-headers"
licence = "Own measurement: header numbers of the owner's own game archives, no content recorded"
date = 2026-11-21
recorded_by = "J.W. Jonkers"
role = "specifier"
verified = false
note = "Measured 2026-11-21 (numbers only). The writer's choice of which bit goes with which extension is its own (the page names the bits, not the extensions; .btr and .bto are the LOD terrain and object files that live in the meshes archive), and is checked in the game by issue 132. Source record (exact): the content-type bits (0x1 meshes, 0x2 textures, 0x100 miscellaneous) were read from the Internet Archive copy https://web.archive.org/web/20221210224330/https://en.uesp.net/wiki/Oblivion_Mod:BSA_File_Format (snapshot of 2022-12-10, CC-BY-SA-2.5, read 2026-11-21; the live site answers HTTP 403 to automated reads; that route is not yet accepted by the owner and no further page is read that way); the page has no code that was used, and the header numbers above are measurements. Not second-read. SECOND READING OF THE SAVED PAGE 2026-11-21 (#158; by a reader who did not write the code that uses the row): read from a copy saved on 2026-11-21, last edited 17 April 2021; permanent link https://en.uesp.net/w/index.php?title=Oblivion_Mod:BSA_File_Format&oldid=2390443; live address https://en.uesp.net/wiki/Oblivion_Mod:BSA_File_Format. Page part re-read from the saved Oblivion page (oldid 2390443, last edited 17 April 2021, the same revision as the 2022-12-10 Internet Archive copy named above): it lists the content type flags as 0x1 meshes, 0x2 textures, 0x4 menus, 0x8 sounds, 0x10 voices, 0x20 shaders, 0x40 trees, 0x80 fonts, 0x100 miscellaneous (the Skyrim page, oldid 3098605, the same). It says nothing about which file extension goes with which bit, so the extension choices (.btr and .bto as meshes) stay the writer's own. In the Oblivion page the field is a uint32; for v104 the Skyrim page makes it a ushort followed by a ushort padding. Also from the pages: archive flag 0x80 is 'Retain Strings During Startup' and 0x40 (archive) is the Xbox 360 flag; the file flag 0x40 is trees and 0x80 fonts. The header numbers themselves are the owner's measurements and are not a page reading, so the row stays unverified. The page had no code samples; nothing was taken from any."
