[[source]]
id = "game-land-fill"
fact = "In the game's own terrain diffuse tiles a cell with a LAND record but no textures is filled with one flat colour: the default land texture's mean colour (about 93, 88, 77) where vertex colours are absent or white, as in every world except TheStripWorldNew, whose tiles over such cells (3971 of its 4096 LAND records have heights and normals only) are one brown (67, 61, 49) at all levels. A cell of the world's extent with an exterior CELL record and no LAND record has the same flat default colour. A cell with no CELL and no LAND record is a flat grey (125, 126, 125)."
url = "oracle:game-lod-files"
licence = "Mean colours and spreads of the owner's own game files compared as numbers; no content is recorded"
date = 2026-11-22
recorded_by = "J.W. Jonkers"
role = "specifier"
verified = false
note = "Measured on the diffuse tiles of 24 worlds of the base game and four add-ons (numbers only), against the same tiles generated with the default land texture. TheStripWorldNew: game level 4 mean (66.6, 60.6, 49.0), standard deviation about 2 over 243 of 256 tiles; the default texture's mean is (92.8, 87.0, 74.9), so the fill is the default colour times (0.72, 0.70, 0.65); the mean vertex colour of WastelandNVmini (184.5, 177.7, 168.3 of 255) gives the same factors to 1 percent, which suggests the tiles were made from other land data, but the records do not state it and the same height-only records of WastelandNVmini, Lucky38World, WastelandNV (1594 cells), NVDLC03BigMT and NVDLC02ZionCanyon give the default colour. Where the Strip's LAND has textures the tiles agree with the generated ones. In the 18 smaller worlds (Freeside and its parts, Gomorrah, Boulder City, DLC01 towns, DLC04 Road, Divide, Silo, Legion, NCR) the cells with LAND agree with the generated tiles within 2 levels, the CELL-only cells are flat (92, 88, 76) (212 cells of FreesideWorld, standard deviation of the cell means 2.3) and the cells with no record are flat (125, 126, 125) (225 cells, deviation 0.1). The cause of the Strip's brown is not known; it is a measured constant for that world. Pictures from inside the Strip, the game's own against generated, were compared by eye: before the fill the far plain and mountains were paler and flatter than the game's."
