[[source]]
id = "game-lod-block-grid-cell-records"
fact = "The cell where the block grid of a worldspace starts in the game's own terrain LOD tree is the smallest grid coordinate (x and y separately) of the world's exterior CELL records, whether or not the cells have LAND; it equals the NAM0 cell except for NVDLC01WestTownS (NAM0 cell -5, -5; smallest CELL -4, -4; the tree starts at -4, -4) and the main world (see the note)."
url = "oracle:game-lod-files"
licence = "Block names of the owner's own game files compared with CELL grid coordinates and NAM0 of the plugins as numbers; no content is recorded"
date = 2026-11-21
recorded_by = "J.W. Jonkers"
role = "specifier"
verified = false
note = "Measured on the ten plugins of Fallout New Vegas and its DLCs against the game's tree (24 worlds with terrain blocks of the reference: every file of every level must satisfy (x - start) mod level = 0). Candidates and worlds they fit: NAM0 cell 22 of 24 (fails NVDLC01WestTownS and WastelandNV); smallest CELL 23 of 24 (fails only WastelandNV: smallest CELL -65, -65, tree -64, -64); smallest cell with LAND 9 of 24. For the main world the existing exception stays: when the first cell with LAND, after dropping outlying edges (a row or column under 2 percent of the cells its line could hold), lies on the 32 grid exactly one cell above the start, it is the start; with the smallest CELL as the start this fits all 24 and is not understood beyond that. Not second-read."
