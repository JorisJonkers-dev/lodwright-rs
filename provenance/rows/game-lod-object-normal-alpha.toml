[[source]]
id = "game-lod-object-normal-alpha"
fact = "The game's own far-object normal atlas of WastelandNV (textures/landscape/lod/wastelandnv/blocks/wastelandnv.buildings_n.dds, DXT5, 1024 by 512) has alpha 27 in every texel. The engine lights far objects by that alpha: a far view drawn with lodwright's normal atlas (alpha from each source, most sources read as full: mean 129 on WastelandNV) shows a grey sheen on far rock that the same view with alpha 0 does not."
url = "oracle:game-lod-files"
licence = "Header fields and texel statistics of the owner's own game files and of pictures taken locally; no file content is recorded"
date = 2026-11-22
recorded_by = "J.W. Jonkers"
role = "specifier"
verified = false
note = "Read from the game's archive Fallout - Textures2.bsa on a 133-plugin modded TTW load order: all 524288 texels have alpha 27. For comparison, numbers only: Tale of Two Wastelands ships the Capital's atlas wasteland.buildings_n.dds as DXT1 (no alpha channel, read as full), and the owner's xLODGen output has a mean alpha of 13 (WastelandNV) and 10 (Wasteland), mostly 0. The pictures: six views of that load order in one engine run, lodwright's normal atlases with their own alpha against the same atlases with alpha 0; the far rock objects differ (0.7 to 1.3 percent of pixels changed in the views with far rock). lodwright writes 27 everywhere, for every world. Not second-read."
