[[source]]
id = "game-lod-terrain-worlds"
fact = "Which worldspaces the game's tree has terrain LOD for is not given by any WRLD field or by LAND data found so far; at least 17 cells with a LAND record fits 28 of 30 measured worlds with LAND (GamorrahWorld and TestMap01 are wrong), and adding that the WRLD record has a FULL name fits 29 of 30 (only GamorrahWorld is wrong); GamorrahWorld has terrain LOD in no file of the game's tree."
url = "oracle:game-lod-files"
licence = "File names of the owner's own game files compared with fields and counts of the plugins as numbers; no content is recorded"
date = 2026-11-21
recorded_by = "J.W. Jonkers"
role = "specifier"
verified = false
note = "Ten plugins of Fallout New Vegas and its DLCs, 33 worldspaces, 30 with LAND, 24 with terrain files in the reference (level files directly in the world's folder). Worlds in none of the reference's terrain folders: FFEncounterWorld, FXInvertedDaylightWorld, HeightTest01 (no LAND), GreenhouseWorld01 (15 cells with LAND), NVDLC01TestMap01 (12), NVDLC03Higgs (9), TheFortWorld (13), GamorrahWorld (56), TestMap01 (183). Smallest world with terrain LOD: 17 cells with a LAND record (NVDLC01WestTownN and S; only 7 and 8 of those records hold a VHGT, while NVDLC03Higgs has 9, so the count must be of LAND records, not of cells with heights). The only two worlds whose WRLD record has no FULL are TestMap01 and HeightTest01 (no LAND); every world with terrain LOD has a FULL. Best single-feature thresholds on the 30 worlds with LAND (errors out of 30): cells with LAND at least 17 gives 2 (GamorrahWorld, TestMap01 wrong), references visible when distant at least 4 gives 2, WRLD OFST size at least 484 gives 2, declared height at least 10 cells gives 2, declared area at least 100 cells gives 2; the count of cells with a CELL record gives 3, all other fields tried give 4 or more: parent worldspace and PNAM flags (all children have only the map-data bit), DATA flags, record flags, MNAM, ICON, FULL, XEZN, ZNAM, INAM, CNAM, count of references, land height range, share of flat cells. A settings file exists for 25 of the 26 worlds with files in the reference, including GamorrahWorld, which has object blocks and a settings file but no terrain block (two files only in the game's archives), so the settings file does not predict it either. Lucky38World has 55 of its 256 level 4 blocks as one blob in the middle (x -16 to 16, y -12 to 12 in cells); the cells with texture layers (ATXT) lie only in the blob but cover 15 of its 55 blocks, and references cover 2, so no cell field explains it. The rule above is the project's own design, not a source statement. Not second-read."
