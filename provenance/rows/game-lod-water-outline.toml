[[source]]
id = "game-lod-water-outline"
fact = "In the water shapes of the game's own terrain blocks of the main world (second and later shapes, vertex positions only) the sloped edge is one height, -14098, at every level (12, 14, 9 and 5 percent of the water vertices at levels 4, 8, 16 and 32; a few level 4 vertices lie between at -12242.667 and -12010.75); the top vertices are irregular, about 20 percent on the level's sample grid, and at level 4 some 11 percent lie outside the block (to -32 in y and beyond), none at the higher levels; the median water vertex count per block with water is 307, 61, 38 and 30 at levels 4, 8, 16 and 32 (minimum 5, 4, 4, 4; maximum 4239, 229, 138, 162); a one-vertex shape with all coordinates zero sits between the terrain shape and the water shape in 47, 16, 6 and 2 blocks (71 in all)."
url = "oracle:game-lod-files"
licence = "Vertex counts and positions of the owner's own game files compared as numbers; no content is recorded"
date = 2026-11-21
recorded_by = "J.W. Jonkers"
role = "specifier"
verified = false
note = "Measured on the reference tree extracted from the game's archives for WastelandNV (1024, 256, 64 and 16 blocks at levels 4, 8, 16 and 32; 98, 39, 19 and 8 with water; the generator's output has 97, 38, 18 and 8, and one block per level 4, 8 and 16 where the game has water and it has none). Method: dump the vertices of each shape with the repository's NIF reader. Complements game-lod-water-shape and game-lod-water-height; the empty shape count is higher than the 25 differing block types that verify reports because verify counts only differences. Not measured: the inset distance and how a neighbour-sourced block takes its height. Not second-read."
