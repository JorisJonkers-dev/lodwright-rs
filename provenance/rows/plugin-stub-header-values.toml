[[source]]
id = "plugin-stub-header-values"
fact = "TES4 header values of the game's own master files, read as numbers (names of the files and numbers only, no content): the record flags are 0x1 (master) in every one of ten files; the form id is 0; the second word of the version-control field is 0x2 in FalloutNV.esm and 0xf in the nine others; HEDR holds an f32 version of 1.34 (FalloutNV.esm, GunRunnersArsenal.esm, LonesomeRoad.esm, OldWorldBlues.esm), 1.33 (HonestHearts.esm) or 1.32 (the other five), a record count (14 to 542016) and a next object id with 0x800 in its low 24 bits (the top byte 0xff in all ten); CNAM is a zero-terminated author; MAST with a DATA of 8 bytes follows for the files that have a master; a master-less file (FalloutNV.esm) has HEDR and CNAM only. The stub plugin writes flags 0 (a plugin, not a master), form id 0, version-control words 0 and 0xf, HEDR 1.34 with a record count of 0 and next object id 0x800, CNAM, SNAM and one master (MAST and an 8-byte DATA holding the master file's size), the first plugin of the load order."
url = "oracle:game-plugin-headers"
licence = "Own measurement: header numbers of the owner's own game plugins, no content recorded"
date = 2026-11-21
recorded_by = "J.W. Jonkers"
role = "specifier"
verified = false
note = "Measured 2026-11-21 by reading the first record of each .esm file in the install's Data folder (no .esp is installed there). No plugin of the install has zero records or a plugin (non-master) flag, so the stub's flags 0, count 0 and next id 0x800 (without the 0xff top byte) are the writer's choice, not a measured value; the load of the stub in the game is issue 132. Measured in the engine on 2026-11-21 (issue 132, nv-rs engine through its bench): a stub WITHOUT a master is read as a plugin (its header is parsed) but its same-named archive is never opened, while the archives of the game's own DLC plugins (which have a master) are; the engine's translation of the game's data handler opens the `Data\\<name>*.bsa` archives only of a plugin whose master list is not empty, so the stub carries FalloutNV.esm (or the first plugin) as its master. The SNAM description subrecord is the writer's addition, read by esplugin as the description. Source record (exact): the Oblivion TES4 record page (HEDR version 0.8 for Oblivion) was read on 2026-11-21 through the Internet Archive copy of https://en.uesp.net/wiki/Tes4Mod:Mod_File_Format/TES4 (the live site answers HTTP 403 to automated reads; that route is not yet accepted by the owner); it gave nothing used here, the values are the measurements above. Not second-read."
