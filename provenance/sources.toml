[[source]]
id = "nif-header-layout"
fact = "A Fallout 3 and New Vegas NIF starts with the text line 'Gamebryo File Format, Version 20.2.0.7' ended by the byte 0x0A, then the version as a u32 (20.2.0.7), the endian type as a u8 (1 = little), the user version as a u32 and the number of blocks as a u32. When the user version is at least 3 the Bethesda stream header follows: user version 2 (u32), then export info: author as a short string (u8 length, then characters), an unknown u32 only when user version 2 is above 130, a process-script short string only when user version 2 is below 131, an export-script short string, and a max-filepath short string only when user version 2 is at least 103."
url = "https://github.com/TES5Edit/TES5Edit/blob/3ccc9e7d733becfcc97940cf0c877fa3d6213c5b/Core/wbDataFormatNif.pas"
licence = "MPL-2.0 (file header of wbDataFormatNif.pas, TES5Edit repository, revision 3ccc9e7d733becfcc97940cf0c877fa3d6213c5b)"
date = 2026-11-14
recorded_by = "J.W. Jonkers"
role = "specifier"
verified = true
note = "Read in wbDefineNifHeaderFooter, NiHeader_EnBSHeader and the NiHeader_En* conditions. lodwright probe reads only version 20.2.0.7 down to the block table and reports the version number for any other."

[[source]]
id = "probe-nif-block-table"
fact = "In a NIF of version 20.2.0.7 the header continues after the export info with: the number of block types (u16), that many block type names as sized strings (u32 length, then characters), one u16 block type index per block, one u32 byte size per block, the number of strings (u32), the maximum string length (u32), that many sized strings, the number of groups (u32) and that many u32 group values. The block data follows the header directly, block after block in the order of the block type index array, each of the size given in the block size array."
url = "https://github.com/TES5Edit/TES5Edit/blob/3ccc9e7d733becfcc97940cf0c877fa3d6213c5b/Core/wbDataFormatNif.pas"
licence = "MPL-2.0 (file header of wbDataFormatNif.pas, TES5Edit repository, revision 3ccc9e7d733becfcc97940cf0c877fa3d6213c5b)"
date = 2026-11-14
recorded_by = "J.W. Jonkers"
role = "specifier"
verified = true
note = "Read in wbDefineNifHeaderFooter. That block data directly follows the header, in array order, with the stated sizes, is read from the Block Size array being present since 20.2.0.7 and is checked at probe time against the file length."

[[source]]
id = "probe-nif-geometry-data-layout"
fact = "For version 20.2.0.7 the fields of NiGeometryData are, in order: group id (s32), number of vertices (u16), keep flags (u8), compress flags (u8), has-vertices (u8 bool), the vertices (three f32 each) when has-vertices is set, the vector flags (u16; bit 0 is the UV-present flag, bit 12 (4096) the tangents flag), the material CRC (u32, only when the user version is 12), has-normals (u8 bool), the normals (three f32 each) when set, tangents then bitangents (three f32 each) when has-normals is set and the tangents flag is set, the bounding sphere (centre three f32 and radius f32), has-vertex-colors (u8 bool), the vertex colours (four f32 each) when set, the UV sets (one set of two f32 per vertex for each UV count, which for this version is the UV-present bit), the consistency flags (u16) and the additional-data reference (s32)."
url = "https://github.com/TES5Edit/TES5Edit/blob/3ccc9e7d733becfcc97940cf0c877fa3d6213c5b/Core/wbDataFormatNif.pas"
licence = "MPL-2.0 (file header of wbDataFormatNif.pas, TES5Edit repository, revision 3ccc9e7d733becfcc97940cf0c877fa3d6213c5b)"
date = 2026-11-14
recorded_by = "J.W. Jonkers"
role = "specifier"
verified = true
note = "Read in wbDefineNiGeometryData and its NiGeometryData_* conditions, and wbBool (u8 from version 4.1.0.1)."

[[source]]
id = "nif-trishape-strips-data"
fact = "NiTriBasedGeomData adds the number of triangles (u16) after the NiGeometryData fields. NiTriShapeData then has: number of triangle points (u32), has-triangles (u8 bool), the triangles (three u16 indices each) when set, the number of match groups (u16) and that many match groups (each a u16 count followed by that many u16 vertex indices). NiTriStripsData then has: number of strips (u16), one u16 strip length per strip, has-points (u8 bool) and, when set, one list of u16 indices per strip with the stated length."
url = "https://github.com/TES5Edit/TES5Edit/blob/3ccc9e7d733becfcc97940cf0c877fa3d6213c5b/Core/wbDataFormatNif.pas"
licence = "MPL-2.0 (file header of wbDataFormatNif.pas, TES5Edit repository, revision 3ccc9e7d733becfcc97940cf0c877fa3d6213c5b)"
date = 2026-11-14
recorded_by = "J.W. Jonkers"
role = "specifier"
verified = true
note = "Read in wbDefineNiTriBasedGeomData, wbDefineNiTriShapeData, wbDefineNiTriStripsData and wbMatchGroup. Indices are u16 in these blocks, so the index width is 16 bits."

[[source]]
id = "nif-texture-set"
fact = "A BSShaderTextureSet block is an array of sized strings (a u32 count, then each string as a u32 length followed by its characters): the texture paths of a material."
