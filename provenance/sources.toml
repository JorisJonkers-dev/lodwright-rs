[[source]]
id = "dds-header-flags-caps"
fact = "Writers set DDSD_CAPS (0x1), DDSD_HEIGHT (0x2), DDSD_WIDTH (0x4) and DDSD_PIXELFORMAT (0x1000) in dwFlags, DDSD_MIPMAPCOUNT (0x20000) for a mipmapped texture and DDSD_LINEARSIZE (0x80000) for a compressed one; dwCaps has DDSCAPS_TEXTURE (0x1000), and for more than one surface also DDSCAPS_COMPLEX (0x8) and DDSCAPS_MIPMAP (0x400000). dwPitchOrLinearSize of a compressed texture is the byte size of the top level."
url = "https://learn.microsoft.com/en-us/windows/win32/direct3ddds/dds-header"
