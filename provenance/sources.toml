[[source]]
id = "nif-header-magic-version"
fact = "A NIF starts with the text line 'Gamebryo File Format, Version 20.2.0.7' ended by a line feed (0x0A), then the version as a u32 (0x14020007). The NetImmerse magic is the alternative first line for older files and is not handled."
url = "https://github.com/TES5Edit/TES5Edit/blob/3ccc9e7d733becfcc97940cf0c877fa3d6213c5b/Core/wbDataFormatNif.pas"
licence = "MPL-2.0 (file header; TES5Edit/TES5Edit at revision 3ccc9e7d733becfcc97940cf0c877fa3d6213c5b)"
date = 2026-11-14
recorded_by = "J.W. Jonkers"
role = "specifier"
verified = false
note = "NiHeader definition: Magic (terminator 0x0A) and Version (u32, default 20.2.0.7); TwbNifFile.UnSerialize checks the magic constant sNifMagicGamebryo."

[[source]]
id = "nif-header-fields"
fact = "After the version: endian type (u8, 1 = little endian, present since 20.0.0.4), user version (u32, since 10.0.1.8), block count (u32); then, when the version is 20.2.0.7 and the user version is 3 or more, user version 2 (u32) and the export info: author (short string), an unknown u32 only when user version 2 is above 130, process script (short string) only when user version 2 is below 131, export script (short string), max file path (short string) only when user version 2 is 103 or more. A short string is a u8 length then that many bytes."
url = "https://github.com/TES5Edit/TES5Edit/blob/3ccc9e7d733becfcc97940cf0c877fa3d6213c5b/Core/wbDataFormatNif.pas"
licence = "MPL-2.0 (file header; TES5Edit/TES5Edit at revision 3ccc9e7d733becfcc97940cf0c877fa3d6213c5b)"
date = 2026-11-14
recorded_by = "J.W. Jonkers"
role = "specifier"
verified = false
note = "NiHeader definition and NiHeader_EnBSHeader and the NiHeader_EnExport* conditions; wbShortString is dfChars with a one byte length prefix. Whether the length byte counts a trailing NUL is not decided here: the bytes are carried raw."

[[source]]
id = "nif-block-table"
fact = "Next in the header: block type count (u16) and that many sized strings (u32 length, then the bytes, no terminator); one u16 type index per block; one u32 size per block (since 20.2.0.7); string count (u32), maximum string length (u32), that many sized strings; group count (u32) and that many u32. The block bodies follow in order, each exactly its size."
url = "https://github.com/TES5Edit/TES5Edit/blob/3ccc9e7d733becfcc97940cf0c877fa3d6213c5b/Core/wbDataFormatNif.pas"
licence = "MPL-2.0 (file header; TES5Edit/TES5Edit at revision 3ccc9e7d733becfcc97940cf0c877fa3d6213c5b)"
date = 2026-11-14
recorded_by = "J.W. Jonkers"
role = "specifier"
verified = false
note = "NiHeader definition (Block Types, Block Type Index, Block Size, Num Strings, Max String Length, Strings, Num Groups, Groups) and wbSizedString (u32 length prefix, no terminator) in wbDataFormatNifTypes.pas; TwbNifFile.UpdateHeader computes Max String Length as the longest string."

[[source]]
id = "nif-footer-roots"
fact = "After the last block comes the footer: a u32 count of roots and that many block links (i32)."
url = "https://github.com/TES5Edit/TES5Edit/blob/3ccc9e7d733becfcc97940cf0c877fa3d6213c5b/Core/wbDataFormatNif.pas"
licence = "MPL-2.0 (file header; TES5Edit/TES5Edit at revision 3ccc9e7d733becfcc97940cf0c877fa3d6213c5b)"
date = 2026-11-14
recorded_by = "J.W. Jonkers"
role = "specifier"
verified = false
note = "NiFooter definition: Roots as an array with a u32 count of NiRef."

[[source]]
id = "nif-primitive-encodings"
fact = "In 20.2.0.7 a string field is an i32 index into the header string table (-1 for none), a block link is an i32 block index (-1 for none), a bool is one byte, a vector is 3 f32, a texture coordinate 2 f32, a colour with alpha 4 f32, a triangle 3 u16, a rotation 9 f32 in the stored order m11 m21 m31 m12 m22 m32 m13 m23 m33, a bounding sphere is centre (3 f32) then radius (f32); all little endian."
url = "https://github.com/TES5Edit/TES5Edit/blob/3ccc9e7d733becfcc97940cf0c877fa3d6213c5b/Core/wbDataFormatNif.pas"
licence = "MPL-2.0 (file header; TES5Edit/TES5Edit at revision 3ccc9e7d733becfcc97940cf0c877fa3d6213c5b)"
date = 2026-11-14
recorded_by = "J.W. Jonkers"
role = "specifier"
verified = false
note = "wbString (S32 index from version 20.1.0.3, sized string before), wbNiRef (S32, default -1), wbBool (u8 from 4.1.0.1) in wbDataFormatNif.pas; wbVector3, wbTexCoord, wbColor4, wbRotMatrix33, wbNiBound, wbTriangle in wbDataFormatNifTypes.pas (at the same revision)."

[[source]]
id = "nif-objectnet-avobject-ninode"
fact = "NiObjectNET is name (string index), extra data list (u32 count, links), controller (link). NiAVObject adds flags (u32 when user version 2 is above 26, else u16), translation (3 f32), rotation (9 f32), scale (f32), the property list (u32 count, links) only when user version 2 is 34 or less, and the collision object (link). NiNode adds children (u32 count, links) and effects (u32 count, links) only when user version 2 is below 130."
url = "https://github.com/TES5Edit/TES5Edit/blob/3ccc9e7d733becfcc97940cf0c877fa3d6213c5b/Core/wbDataFormatNif.pas"
licence = "MPL-2.0 (file header; TES5Edit/TES5Edit at revision 3ccc9e7d733becfcc97940cf0c877fa3d6213c5b)"
date = 2026-11-14
recorded_by = "J.W. Jonkers"
role = "specifier"
verified = false
note = "wbDefineNiObjectNET, wbDefineNiAVObject (NiAVObject_DecideFlags, NiAVObject_EnProperties), wbDefineNiNode (NiNode_EnEffects), version 20.2.0.7 branches only; the transform is stored translation, rotation, scale."

[[source]]
id = "nif-trishape-geometry"
fact = "NiTriShape adds nothing to NiGeometry. NiGeometry after the NiAVObject part: data link, skin instance link, then (user version 2 below 100) u32 material count, that many material name string indices, that many material extra data links (i32), active material (i32), a material-needs-update bool; then, when user version is 12, shader property link and alpha property link."
url = "https://github.com/TES5Edit/TES5Edit/blob/3ccc9e7d733becfcc97940cf0c877fa3d6213c5b/Core/wbDataFormatNif.pas"
licence = "MPL-2.0 (file header; TES5Edit/TES5Edit at revision 3ccc9e7d733becfcc97940cf0c877fa3d6213c5b)"
date = 2026-11-14
recorded_by = "J.W. Jonkers"
role = "specifier"
verified = false
note = "wbDefineNiGeometry and wbDefineNiTriShape, 20.2.0.7 branch (Has Shader and Shader Name exist only up to 20.1.0.3; Material Needs Update exists only at exactly 20.2.0.7)."

[[source]]
id = "nif-geometry-data-layout"
fact = "NiGeometryData: group id (i32), vertex count (u16), keep flags (u8), compress flags (u8), has-vertices bool and the vertices, vector flags (u16), material CRC (u32) only when user version is 12, has-normals bool and the normals, tangents then bitangents only when there are normals and bit 0x1000 of the vector flags is set, bounding sphere, has-vertex-colours bool and the RGBA colours, the UV sets (their number is bit 0 of the vector flags at 20.2.0.7), consistency flags (u16), additional data link. NiTriBasedGeomData adds triangle count (u16). NiTriShapeData adds triangle point count (u32), a has-triangles bool and the triangles, match group count (u16) and for each group a u16 count and that many u16 vertex indices."
url = "https://github.com/TES5Edit/TES5Edit/blob/3ccc9e7d733becfcc97940cf0c877fa3d6213c5b/Core/wbDataFormatNif.pas"
licence = "MPL-2.0 (file header; TES5Edit/TES5Edit at revision 3ccc9e7d733becfcc97940cf0c877fa3d6213c5b)"
date = 2026-11-14
recorded_by = "J.W. Jonkers"
role = "specifier"
verified = false
note = "wbDefineNiGeometryData (NiGeometryData_EnTangents, NiGeometryData_GetCountUVSets with mask 1 at version 20.2.0.7), wbDefineNiTriBasedGeomData, wbDefineNiTriShapeData; wbConsistencyType is a u16."

[[source]]
id = "nif-property-layout"
fact = "NiAlphaProperty: NiObjectNET part, flags (u16), threshold (u8). NiZBufferProperty: NiObjectNET part, flags (u16); its compare function field ends at 20.0.0.5. NiMaterialProperty: NiObjectNET part, no flags at this version, ambient and diffuse colours (3 f32 each) only when user version 2 is below 26, specular and emissive colours (3 f32 each), glossiness (f32), alpha (f32), emissive multiplier (f32) only when user version 2 is above 21."
url = "https://github.com/TES5Edit/TES5Edit/blob/3ccc9e7d733becfcc97940cf0c877fa3d6213c5b/Core/wbDataFormatNif.pas"
licence = "MPL-2.0 (file header; TES5Edit/TES5Edit at revision 3ccc9e7d733becfcc97940cf0c877fa3d6213c5b)"
date = 2026-11-14
recorded_by = "J.W. Jonkers"
role = "specifier"
verified = false
note = "wbDefineNiAlphaProperty, wbDefineNiZBufferProperty (NiZBufferProperty_EnFunction), wbDefineNiMaterialProperty (EnBefore10012 for flags, NiMaterialProperty_EnAmbientColor, NiMaterialProperty_EnEmissiveMult)."
