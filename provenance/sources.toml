note = "Read directly. Block span in cells per level is not stated there; the examples (x-20 y-28 at level 4, x-40 y-64 at level 4, X32 Y32 at level 32) are all multiples of the level."

[[source]]
id = "fnv-lod-texture-options"
fact = "Generator guidance for terrain textures: size 512 for level 4 and 256 for the other levels (higher for retextured terrain), options for diffuse, normal, baked normal maps and mipmaps; object LOD uses an atlas whose maximum size and per-texture size limit are options."
url = "https://vivanewvegas.moddinglinked.com/lod.html"
licence = "Guide text; facts only, no text is copied; the site states no licence"
