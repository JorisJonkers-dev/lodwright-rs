[[source]]
id = "fnv-lod-settings-dlodsettings"
fact = "The per-world LOD settings file for Fallout 3 and New Vegas is LODSettings\\<world>.dlodsettings under the data folder (extension .dlodsettings, not .lod); the editor creates it when it builds terrain LOD, and a generator only produces LOD for worlds that have one. It holds the cell coordinates of the world's south-west corner. The vanilla wastelandnv file ships inside Fallout - Misc.bsa."
