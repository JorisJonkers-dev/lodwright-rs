[[source]]
id = "fnv-lod-block-container-nif"
fact = "In Fallout 3 and New Vegas the per-block LOD meshes are NIF files with the extension .nif; the .btr, .bto and .btt extensions belong to the Skyrim and Fallout 4 engines. Public file listings of New Vegas LOD give block meshes such as wastelandnv.level4.x-20.y-28.nif and no .btr file."
url = "https://taleoftwowastelands.com/viewtopic.php@t=5035"
licence = "Forum post; only file names and paths are recorded, no text is copied; the site states no licence"
date = 2026-11-14
recorded_by = "J.W. Jonkers"
role = "specifier"
verified = false
note = "Read directly (post by zilav, 2015-03-21). The statement that .btr/.bto are Skyrim and Fallout 4 formats comes from the DynDOLOD help pages (see fnv-btr-bto-other-games). Contradicts the .btr claim in lod-terrain-paths."

[[source]]
id = "fnv-lod-object-block-names"
fact = "Object LOD block meshes are named <world>.level<L>.x<X>.y<Y>.nif in meshes\\landscape\\lod\\<world>\\blocks\\, lower case in the vanilla example (wastelandnv.level4.x-20.y-28.nif); a second file per block, <world>.level4.high.x<X>.y<Y>.nif, holds objects flagged high priority. Negative coordinates carry a minus sign directly after x or y."
url = "https://taleoftwowastelands.com/viewtopic.php@t=5035"
licence = "Forum post; only file names and paths are recorded, no text is copied; the site states no licence"
date = 2026-11-14
recorded_by = "J.W. Jonkers"
role = "specifier"
verified = false
note = "Read directly. Only level 4 is shown for objects. Whether terrain and object meshes share these names in one folder is open (see docs/spec/object-lod.md)."

