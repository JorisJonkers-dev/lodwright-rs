[[source]]
id = "skyrim-lod-settings-struct"
fact = "Skyrim's LOD settings file is Data/lodsettings/<world>.lod, a 16-byte struct: signed 16-bit left, signed 16-bit bottom, signed 32-bit stride_pow2, signed 32-bit lowestsize_lod, signed 32-bit highestsize_lod (little endian)."
url = "https://en.uesp.net/wiki/Tes5Mod:LOD_Settings_File_Format"
licence = "CC-BY-SA-2.5 (UESP wiki footer; the owner confirms the exact licence when verifying)"
date = 2026-11-14
recorded_by = "J.W. Jonkers"
role = "specifier"
verified = false
note = "Read directly (raw wikitext). Skyrim, not Fallout. Recorded only as the likely shape of the Fallout .dlodsettings; whether Fallout's file is the same is open and must be measured."

[[source]]
