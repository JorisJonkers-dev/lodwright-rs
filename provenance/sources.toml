[[source]]
id = "dds-pixel-format-masks"
fact = "The DDS pixel format is eight u32 fields from file offset 76: size (32), flags, FourCC, RGB bit count, red mask, green mask, blue mask, alpha mask. Flag 0x1 means the alpha mask is valid, 0x4 that the FourCC is valid, 0x40 that the data is uncompressed RGB and the bit count and the RGB masks are valid. The header holds pitch or linear size at offset 20. Mip level 0 data follows the 128 bytes of magic and header (or the 20-byte DX10 extension after them)."
url = "https://learn.microsoft.com/en-us/windows/win32/direct3ddds/dds-pixelformat"
licence = "CC-BY-4.0 (Microsoft Learn documentation)"
date = 2026-11-14
recorded_by = "J.W. Jonkers"
role = "specifier"
verified = true
note = "Read in the MicrosoftDocs/win32 repository at revision bc82a65f74ef2c4f2f44a3d7db5f7cfebfdc3583 (dds-pixelformat.md, dds-header.md); the magic and the placement of the first surface after the header and the DX10 extension are from dx-graphics-dds-pguide.md of the same revision."

[[source]]
id = "dds-header-dxt10"
fact = "A DDS whose FourCC is DX10 has a 20-byte DDS_HEADER_DXT10 after the 124-byte header: DXGI format, resource dimension, misc flag, array size and misc flags 2, each a u32. The DXGI format is the true pixel format."
url = "https://learn.microsoft.com/en-us/windows/win32/direct3ddds/dds-header-dxt10"
licence = "CC-BY-4.0 (Microsoft Learn documentation)"
date = 2026-11-14
recorded_by = "J.W. Jonkers"
role = "specifier"
verified = true
note = "Read in the MicrosoftDocs/win32 repository at revision bc82a65f74ef2c4f2f44a3d7db5f7cfebfdc3583. lodwright probe only reports these numbers."

[[source]]
id = "probe-bc1-block-layout"
fact = "A BC1 (DXT1) block is 8 bytes for a 4 by 4 texel block: color_0 and color_1 as u16 in RGB 5:6:5 (blue in bits 4:0, green 10:5, red 15:11), then two u16 bitmap words with 2 bits per texel, texel [row][column] at bit 2*column (+8 for row 1 of word 0), rows 0 and 1 in word 0 and rows 2 and 3 in word 1, least significant bits first. When color_0 is greater than color_1 (as unsigned integers) the block has four colours, color_2 = (2*color_0 + color_1 + 1)/3 and color_3 = (color_0 + 2*color_1 + 1)/3; otherwise color_2 = (color_0 + color_1)/2 and code 11 is a transparent texel."
url = "https://learn.microsoft.com/en-us/windows/win32/direct3d9/opaque-and-1-bit-alpha-textures"
licence = "CC-BY-4.0 (Microsoft Learn documentation)"
date = 2026-11-14
recorded_by = "J.W. Jonkers"
role = "specifier"
verified = true
note = "Read in the MicrosoftDocs/win32 repository at revision bc82a65f74ef2c4f2f44a3d7db5f7cfebfdc3583. The page does not say in which domain the interpolation runs or how 5 and 6 bit values widen to 8 bits; lodwright probe widens by bit replication and interpolates in 8 bits, so its statistics can differ by one from another decoder. 2026-11-19: both are now in bc-endpoint-promotion (MSB extension; derived colours from the promoted 8-bit values, error bound 1/255). The probe's integer formulas (2a + b + 1)/3 and (a + 2b + 1)/3 equal the exact quotient converted by unorm-conversion (round half up), since a third is never exactly one half. In three-colour mode the probe truncates (a + b)/2, which is one lower than round half up when a + b is odd: inside the 1/255 bound, not equal to the rounded value. Second reader 2026-11-21 (did not implement lodwright probe): re-derived from the Learn page at the recorded revision: the 8-byte block, RGB 5:6:5 bit positions, bitmap word layout (texel [0][0] at bits 1:0, row 1 of word 0 at bits 9:8 and up, rows 2 and 3 in word 1), the unsigned color_0 > color_1 rule, and the (2*c0+c1+1)/3 and (c0+2*c1+1)/3 and (c0+c1)/2 formulas, all as the fact states. The page's three-colour formula is a plain integer (c0+c1)/2, so the probe's truncation is what the page prints; the D3D11.3 specification's bound (1/255) permits it too. Widening and domain: confirmed in bc-endpoint-promotion."

[[source]]
id = "probe-bc3-block-layout"
fact = "A BC3 (DXT4 and DXT5) block is 16 bytes: an 8-byte alpha block, then the 8-byte colour block laid out as BC1 but always decoded in four-colour mode. The alpha block is alpha_0 and alpha_1 (u8 each) and 16 texel codes of 3 bits in the remaining 6 bytes, read as one little-endian 48-bit value with texel [0][0] in the lowest bits, row by row. If alpha_0 is greater than alpha_1 the other six alphas are (k*alpha_0 + (7-k)*alpha_1 + 3)/7 for codes 2..7 with k = 6 down to 1; otherwise codes 2..5 are ((5-k)*alpha_0 + k*alpha_1 + 2)/5 for k = 1..4 (code k+1), code 6 is 0 and code 7 is 255."
url = "https://learn.microsoft.com/en-us/windows/win32/direct3d9/textures-with-alpha-channels"
licence = "CC-BY-4.0 (Microsoft Learn documentation)"
date = 2026-11-14
recorded_by = "J.W. Jonkers"
role = "specifier"
verified = true
note = "Read in the MicrosoftDocs/win32 repository at revision bc82a65f74ef2c4f2f44a3d7db5f7cfebfdc3583. The byte table of the page lists the codes of row 0 first in byte 2, which is the little-endian reading used here. 2026-11-19: the colour block's promotion and interpolation domain are in bc-endpoint-promotion, the alpha precision in bc3-alpha-interpolation. The probe's integer formulas (k*a0 + (7-k)*a1 + 3)/7 and ((5-k)*a0 + k*a1 + 2)/5 equal the exact float quotient converted to 8 bits by unorm-conversion (no seventh or fifth is exactly one half), so the probe gives the specification's value rounded to UNORM8; the specification asks for UNORM16 filtering precision, which an 8-bit statistic does not use. Second reader 2026-11-21 (did not implement lodwright probe): re-derived from the Learn page at the recorded revision: the alpha formulas with +3 over 7 and +2 over 5, codes 6 and 7 as 0 and 255 in the six-alpha case, and the byte table (byte 2 holds [0][0] in its lowest bits, then [0][1], [0][2]), which is the little-endian 48-bit reading in the fact; the colour block is always four-colour mode as the page states."

[[source]]
id = "bc-endpoint-promotion"
fact = "In BC1, BC2 and BC3 the two 5:6:5 endpoint colours are promoted to 8-bit UNORM by MSB extension: the value is shifted left by the missing bits and its own most significant bits fill the new low bits. The derived colours are computed from the promoted values, per channel: in BC1's four-colour mode color_2 = (2*color_0_p + color_1_p)/3 and color_3 = (color_0_p + 2*color_1_p)/3, in its three-colour mode color_2 = (color_0_p + color_1_p)/2. Filtering must occur with at least UNORM8 precision, and the allowed absolute error is 1/255."
url = "https://github.com/microsoft/DirectX-Specs/blob/ae2cc81d8f97df9ce8597e25d84405273f09d08c/d3d/archive/D3D11_3_FunctionalSpec.htm"
licence = "CC-BY-4.0 (microsoft/DirectX-Specs repository licence)"
date = 2026-11-19
recorded_by = "J.W. Jonkers"
role = "specifier"
verified = true
note = "D3D11.3 functional specification, sections 19.5.3 (promotion to wider UNORM values, UNORMPromote), 19.5.6 (BC1), 19.5.7 (BC2) and 19.5.8 (BC3, which says colour palette entries follow the BC1 rules; its own formula is printed with color_0 and color_1 where BC1 uses the promoted names). Section 25.1.1 maps DXT1 to BC1 and DXT4/DXT5 to BC3. The specification states whether the division is exact or rounded only through the error bound. Second reader 2026-11-21 (did not implement lodwright probe): re-read the cited sections of the specification at the recorded revision: 19.5.3 (MSB extension, UNORMPromote), 19.5.6 BC1 (promoted values, unsigned compare, /3 and /2 formulas, three-colour code 11 transparent), 19.5.8 BC3 (colour as BC1, prints color_0 for the promoted names), error bound 1/255 for BC1 to BC3 and UNORM8 precision, and the legacy format mapping DXT1 to BC1, DXT4 and DXT5 to BC3 in the legacy-format table. The fact matches. The printed UNORMPromote sample has a variable-name slip (numbits) which does not change the described extension."

[[source]]
id = "bc3-alpha-interpolation"
fact = "BC3 alpha decodes as BC4U: the two 8-bit endpoints are converted to float; when alpha_0 > alpha_1 the six derived values are (6*a0 + 1*a1)/7 to (1*a0 + 6*a1)/7, otherwise four derived values (4*a0 + 1*a1)/5 to (1*a0 + 4*a1)/5 followed by 0.0 and 1.0. Filtering must occur with at least UNORM16 precision; the endpoints, 0.0 and 1.0 must be exact; the allowed absolute error is 1/65535."
url = "https://github.com/microsoft/DirectX-Specs/blob/ae2cc81d8f97df9ce8597e25d84405273f09d08c/d3d/archive/D3D11_3_FunctionalSpec.htm"
licence = "CC-BY-4.0 (microsoft/DirectX-Specs repository licence)"
date = 2026-11-19
recorded_by = "J.W. Jonkers"
role = "specifier"
verified = true
note = "D3D11.3 functional specification, sections 19.5.8 ('Alpha values decode as with BC4U') and 19.5.9 (BC4U). Second reader 2026-11-21 (did not implement lodwright probe): re-read 19.5.8 ('Alpha values decode as with BC4U') and 19.5.9 (BC4U): the 7-way and 5-way weights, 0.0 and 1.0 for the six-value case, unsigned compare, UNORM16 precision, endpoints/0.0/1.0 exact, error 1/65535; the fact matches."

[[source]]
id = "unorm-conversion"
fact = "UNORM to float: the n-bit value is converted to float and divided by (2^n - 1). Float to UNORM: NaN gives 0, values are clamped to 0.0..1.0, multiplied by (2^n - 1), 0.5 is added and the fraction dropped; a tolerance of 0.6 ULP on the integer side is permitted."
url = "https://github.com/microsoft/DirectX-Specs/blob/ae2cc81d8f97df9ce8597e25d84405273f09d08c/d3d/archive/D3D11_3_FunctionalSpec.htm"
licence = "CC-BY-4.0 (microsoft/DirectX-Specs repository licence)"
date = 2026-11-19
recorded_by = "J.W. Jonkers"
role = "specifier"
verified = true
note = "D3D11.3 functional specification, sections 3.2.3.5 and 3.2.3.6. These are the specification's general format conversion rules; that a masked channel of a legacy DDS file is read with them is the specifier's reading, not a statement of the DDS pages. Second reader 2026-11-21 (did not implement lodwright probe): re-read 3.2.3.5 (divide by 2^n - 1) and 3.2.3.6 (NaN to 0, clamp, scale, add 0.5, drop fraction, tolerance 0.6 ULP); the fact matches the specification. That a legacy DDS channel is read with these rules stays the recorded reading, consistent with the d3d9 pages, not a statement of them."

[[source]]
id = "d3d9-format-memory-order"
fact = "Direct3D 9 format names list channels from the most significant bit to the least significant bit (the page's example, ARGB: alpha highest, blue lowest); surface data is stored in memory from the least significant bit to the most significant bit, so the channel order in memory is blue first, alpha last."
url = "https://learn.microsoft.com/en-us/windows/win32/direct3d9/d3dformat"
licence = "CC-BY-4.0 (Microsoft Learn documentation; MicrosoftDocs/win32 repository licence)"
date = 2026-11-19
recorded_by = "J.W. Jonkers"
role = "specifier"
verified = true
note = "Read in the MicrosoftDocs/win32 repository at revision bc82a65f74ef2c4f2f44a3d7db5f7cfebfdc3583, desktop-src/direct3d9/d3dformat.md (ms.date 05/31/2018), the paragraph after the format list. The DDS programming guide (desktop-src/direct3ddds/dx-graphics-dds-pguide.md, same revision) maps D3D9 formats to DDS bit masks (D3DFMT_A8R8G8B8: red mask 0xff0000, alpha mask 0xff000000), which ties the masks to that in-memory order. Second reader 2026-11-21 (did not implement lodwright probe): re-read the d3dformat paragraph (formats listed MSB to LSB, ARGB example, memory order LSB to MSB, blue first) and the DDS programming guide's A8R8G8B8 row (red 0xff0000, green 0xff00, blue 0xff, alpha 0xff000000); the fact matches."

