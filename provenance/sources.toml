id = "fnv-lod-levels"
fact = "Terrain LOD is generated at four levels, 4, 8, 16 and 32, all at once; object LOD has a single level; cell LOD is a loaded/unloaded state, not distance based. A generator run builds terrain first, then objects."
url = "https://vivanewvegas.moddinglinked.com/lod.html"
licence = "Guide text; facts only, no text is copied; the site states no licence"
date = 2026-11-14
