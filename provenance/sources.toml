[[source]]
id = "fnv-object-records"
fact = "Record flag bit 15 (0x8000) is Visible When Distant on STAT, SCOL, ACTI, DOOR and REFR records; bit 6 (0x40) is Has Tree LOD on STAT, SCOL and ACTI; bit 16 (0x10000) of a REFR is High Priority LOD and bit 11 (0x800) Initially Disabled. A model record has its path in MODL. A REFR has NAME (the base FormID), DATA (position then rotation, six f32) and optionally XSCL (an f32 scale). A SCOL has repeated parts, each an ONAM (a STAT FormID) followed by placements."
url = "https://github.com/TES5Edit/TES5Edit/blob/3ccc9e7d733becfcc97940cf0c877fa3d6213c5b/Core/wbDefinitionsFNV.pas"
licence = "MPL-2.0 (xEdit, TES5Edit/TES5Edit at revision 3ccc9e7d733becfcc97940cf0c877fa3d6213c5b)"
date = 2026-11-16
