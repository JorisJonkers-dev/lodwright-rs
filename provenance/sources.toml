[[source]]
id = "bsa-v104-header"
fact = "A v104 BSA (Fallout 3, New Vegas, Skyrim) starts with a 36-byte header: the four bytes 'BSA' and a zero byte, u32 version (104), u32 offset of the folder records (36), u32 archive flags, u32 folder count, u32 file count, u32 total folder-name length (with the NULs, without the length bytes), u32 total file-name length (with the NULs), u16 file flags, u16 padding. Archive flags: 0x1 directory names, 0x2 file names, 0x4 files compressed by default, 0x40 big-endian (Xbox 360), 0x100 file names embedded in the data blocks, 0x200 XMem codec (Xbox 360 only); the others have no effect on the structure. Integers are little endian unless 0x40 is set."
url = "https://en.uesp.net/wiki/Skyrim_Mod:Archive_File_Format"
licence = "CC-BY-SA-2.5 (UESP wiki footer: 'Attribution-ShareAlike 2.5 License'; page last edited 3 August 2024)"
date = 2026-11-14
recorded_by = "J.W. Jonkers"
role = "specifier"
verified = true
note = "The same page states that v104 is also the Fallout 3 and Fallout: New Vegas version (Oblivion is v103). Read in full on the date above; the layout agrees with the Oblivion page https://en.uesp.net/wiki/Tes4Mod:BSA_File_Format (v103, same licence, last edited 17 April 2021). Second reader 2026-11-14: re-derived without the implementation: header layout, flag bits and endianness re-read from the UESP Skyrim BSA page; agrees."

[[source]]
id = "bsa-v104-folder-records"
fact = "Folder records follow the header, 16 bytes each in v104: u64 name hash, u32 file count, u32 offset. The offset points at the folder's block (bzstring folder name when flag 0x1 is set, then one 16-byte file record per file); subtract the total file-name length to get the position inside the file. Folder blocks are stored in folder-record order, one after another."
url = "https://en.uesp.net/wiki/Skyrim_Mod:Archive_File_Format"
licence = "CC-BY-SA-2.5 (UESP wiki footer: 'Attribution-ShareAlike 2.5 License'; page last edited 3 August 2024)"
date = 2026-11-14
recorded_by = "J.W. Jonkers"
role = "specifier"
verified = true
note = "The 24-byte folder record with padding is v105 only. The page gives no explicit statement that blocks are contiguous; the reader locates the name block from the counts and lengths, which assumes they are. Second reader 2026-11-14: re-derived without the implementation: 16-byte record, offset rule and block layout re-read from the UESP Skyrim BSA page (contiguity follows from the structure table); agrees."

[[source]]
id = "bsa-v104-file-records"
fact = "A file record is 16 bytes: u64 name hash, u32 size, u32 offset from the start of the archive. In the size, bit 30 (0x40000000) inverts the archive's compressed-by-default flag for this file; the Oblivion page (Tes4Mod:BSA_File_Format) says bit 31 is used internally. The file names follow the last folder block as one block of lower-case NUL-terminated names without paths, in the order of the file records, when flag 0x2 is set."
url = "https://en.uesp.net/wiki/Skyrim_Mod:Archive_File_Format"
licence = "CC-BY-SA-2.5 (UESP wiki footer: 'Attribution-ShareAlike 2.5 License'; page last edited 3 August 2024)"
date = 2026-11-14
recorded_by = "J.W. Jonkers"
role = "specifier"
verified = true
note = "Reading bit 31 as 'not part of the size' comes from the Oblivion page (Tes4Mod:BSA_File_Format): 'the top two bits have special meaning and are not actually part of the size'. Hashes are not computed or checked; names come from the name block. Second reader 2026-11-14: re-derived without the implementation: 16-byte record, bit 30 and name block re-read from the UESP Skyrim BSA page; bit 31 re-read from the Oblivion page; agrees."

[[source]]
id = "bsa-v104-data-blocks"
fact = "A compressed file block is [bstring full path, only when archive flag 0x100 is set], u32 size of the uncompressed data, then the zlib stream (v104; LZ4 is v105). An uncompressed block is [bstring path when 0x100 is set] then the data. The page says the stored size of a compressed file is the u32 original size plus the compressed data (4 + compressed size)."
url = "https://en.uesp.net/wiki/Skyrim_Mod:Archive_File_Format"
licence = "CC-BY-SA-2.5 (UESP wiki footer: 'Attribution-ShareAlike 2.5 License'; page last edited 3 August 2024)"
date = 2026-11-14
recorded_by = "J.W. Jonkers"
role = "specifier"
verified = false
note = "The page does not say whether the size field also counts the embedded path bstring when flag 0x100 is set. The reader assumes it does (the stored block is exactly size bytes, path included). Measured 2026-11-20 on the three Fallout 3 and New Vegas texture archives that have the flag (34355 files, all compressed): the stored size counts the path, in every file; see provenance/LOG.md, 2026-11-20 measurements (#52). Not measured: a flagged archive with stored (uncompressed) files, none exists on the measuring machine. Stays unverified until a second reader re-derives it."

[[source]]
id = "bsa-path-form"
fact = "BSA folder and file names are lower case, with a backslash as the directory delimiter; a file's full path is the folder name, a backslash and the file name."
url = "https://en.uesp.net/wiki/Skyrim_Mod:Archive_File_Format"
licence = "CC-BY-SA-2.5 (UESP wiki footer: 'Attribution-ShareAlike 2.5 License'; page last edited 3 August 2024)"
date = 2026-11-14
recorded_by = "J.W. Jonkers"
role = "specifier"
verified = true
note = "The page says hashes are of lower-case names with backslashes and that the name block holds lower-case names. Lookup in this project is case insensitive and accepts a forward slash; that is a project choice for loose-file parity, not a recorded fact about the game. Second reader 2026-11-14: re-derived without the implementation: lower case and backslash re-read from the UESP Skyrim BSA page (hash inputs, name block, embedded path example); agrees."

[[source]]
id = "bsa-name-hash"
fact = "xEdit computes the u64 name hash of a v104 (FO3, FNV) folder or file name as follows. The name is lower-cased; a file name is split at its last '.' into stem and extension (the extension keeps the dot), a folder name is not split. Low 32 bits, from the lowest byte: the last character of the stem (if the stem is not empty), the second-to-last character (if the stem is longer than 2), the length of the stem as a byte (always written), the first character (if the stem is not empty), the bytes left zero otherwise; then the extension '.kf' sets 0x80, '.nif' 0x8000, '.dds' 0x8080 and '.wav' 0x80000000 in those low 32 bits. High 32 bits: h = 0, and for every stem character except the first and the last two, h = c + (h << 6) + (h << 16) - h in wrapping 32-bit arithmetic with c the unsigned byte; the same recurrence over the extension characters from a new zero gives h2; the high 32 bits are h + h2 (wrapping)."
url = "https://github.com/TES5Edit/TES5Edit/blob/3ccc9e7d733becfcc97940cf0c877fa3d6213c5b/Core/wbHash.pas"
licence = "MPL-2.0 (xEdit, TES5Edit/TES5Edit at revision 3ccc9e7d733becfcc97940cf0c877fa3d6213c5b)"
date = 2026-11-19
recorded_by = "J.W. Jonkers"
role = "specifier"
verified = false
note = "UNVERIFIED: needs a human second reader before any code relies on this row (verified stays false until then). DRAFT for the C1 work item. Read TwbHash._TES4 and TwbHash.TES5 in Core/wbHash.pas (overflow checks off around the function), and their use in TwbBSArchive.CreateArchive in Core/wbBSArchive.pas: for the FO3/FNV archive type (version 104, baFO3) the folder part is hashed with aHasExtension false and the file name with aHasExtension true, both unsigned; only the Oblivion type (v103) uses the signed-byte variant. The hash function does not convert a forward slash to a backslash; xEdit splits the folder from the file at the last backslash (or the last forward slash if there is none), and bsa-path-form says hashes are of lower-case names with backslashes. This is how one public tool writes archives, not a statement of the game's own lookup. OPEN: a public test vector (D4: a public format page with a test vector first). The UESP pages Skyrim_Mod:Archive_File_Format and Tes4Mod:BSA_File_Format, which describe the hash, answered HTTP 403 to automated reads on 2026-11-19 and were not read; a human reader compares this row with their hash section. An owner oracle check also gives test vectors: the folder and file hashes of a few records of an own v104 archive with their names (numbers and names only)."

[[source]]
id = "bsa-record-order"
fact = "xEdit's v104 archive writer sorts the files by folder hash, then by file hash (both compared as unsigned 64-bit values), creates one folder record per distinct folder hash in that order, and writes each folder's file records in that order; so folder records ascend by folder hash and the file records of a folder ascend by file hash."
url = "https://github.com/TES5Edit/TES5Edit/blob/3ccc9e7d733becfcc97940cf0c877fa3d6213c5b/Core/wbBSArchive.pas"
licence = "MPL-2.0 (xEdit, TES5Edit/TES5Edit at revision 3ccc9e7d733becfcc97940cf0c877fa3d6213c5b)"
date = 2026-11-19
recorded_by = "J.W. Jonkers"
role = "specifier"
verified = false
note = "UNVERIFIED: needs a human second reader before any code relies on this row (verified stays false until then). DRAFT for the C1 work item. Read HashSortTES4 (DirHash64 and NameHash64 are UInt64 fields, so the comparisons are unsigned) and TwbBSArchive.CreateArchive (the branch for Oblivion, Fallout 3, New Vegas, Skyrim and Skyrim SE). This is the order one public writer produces. OPEN: whether the game requires it (for example a binary search over hash-sorted records) or only tolerates it; no source read states the game's lookup. The UESP pages could not be read (HTTP 403). An in-game load of a writer's archive (issue 44's acceptance) and an owner check that the records of a vanilla archive ascend (numbers only) settle it."

[[source]]
id = "bsa-archive-registration"
fact = "xEdit's loader, for FO3 and FNV, loads the archives named in [Archive] sArchiveList (comma separated; from the game INI, or combined with the custom INI when that has an [Archive] section), adds Update.bsa for FNV, and then for every plugin in load order loads each archive in the data folder whose name starts with the plugin's name without extension and ends in .bsa (prefix match). Its comment says all games before Skyrim load archives with this partial match, while Skyrim needs an exact name."
url = "https://github.com/TES5Edit/TES5Edit/blob/3ccc9e7d733becfcc97940cf0c877fa3d6213c5b/Core/wbImplementation.pas"
licence = "MPL-2.0 (xEdit, TES5Edit/TES5Edit at revision 3ccc9e7d733becfcc97940cf0c877fa3d6213c5b)"
date = 2026-11-19
recorded_by = "J.W. Jonkers"
role = "specifier"
verified = false
note = "UNVERIFIED: needs a human second reader before any code relies on this row (verified stays false until then). DRAFT for the C1 work item. Read both TwbLoadingGameContext.FindBSAs overloads (one INI; game INI with custom INI through CheckAddFilesToString) and TwbLoadingGameContext.HasBSAs (Core/wbImplementation.pas), the archive loading in xEdit/xeMainForm.pas, and the capability table in Core/wbInterface.pas (gcArchiveExactNameMatch only for Skyrim and Enderal, gcUpdateArchiveAlwaysLoaded only for FNV; TwbGameDef.GetIsFallout3 is true for FO3 and FNV, so both take the sArchiveList branch). The custom INI here is the game's custom INI passed by the loader, not a plugin's private INI (that one is read only for Skyrim, gcArchivePrivateIni). This is how a tool models the game's archive loading, not a measurement of the game. It agrees with fnv-archive-loading (a guide, licence not stated) on loading with the plugin's name and adds the prefix match. OPEN: the game's behaviour on the target engine; owner decision D2 asks for an in-game test of plugin-named loading before packing ships."

[[source]]
id = "land-vnml-layout"
fact = "The VNML subrecord of LAND is 3267 bytes: a 33 x 33 grid of vertex normals, three bytes (x, y, z) per grid point."
url = "https://en.uesp.net/wiki/Tes4Mod:Mod_File_Format/LAND"
licence = "CC-BY-SA-2.5 (UESP wiki footer: 'Attribution-ShareAlike 2.5 License'; page last edited 3 August 2024)"
date = 2026-11-14
recorded_by = "J.W. Jonkers"
role = "specifier"
verified = false
note = "Cross-read with xEdit Core/wbDefinitionsCommon.pas wbLandNormals at TES5Edit/TES5Edit revision 3ccc9e7d733becfcc97940cf0c877fa3d6213c5b (MPL-2.0): array of 33 rows of 33 structs of three u8. The byte encoding of a component (signed or biased) is not stated by either source; the reader keeps the raw bytes. Corrected 2026-11-19: the fact used to end 'rows from the south', which neither source states for VNML (UESP gives the row order for VHGT and VCLR; xEdit names rows and columns without a direction). PROJECT CHOICE: the reader indexes VNML through the same grid accessor as VCLR (row-major from the south-west vertex, land-vclr-layout). Nothing that generates LOD reads VNML today. OPEN: the VNML row order."

[[source]]
id = "land-vclr-layout"
fact = "The VCLR subrecord of LAND is 3267 bytes: a 33 x 33 grid of 24-bit RGB vertex colours (red, green, blue), rows from the south."
url = "https://en.uesp.net/wiki/Tes4Mod:Mod_File_Format/LAND"
licence = "CC-BY-SA-2.5 (UESP wiki footer: 'Attribution-ShareAlike 2.5 License'; page last edited 3 August 2024)"
date = 2026-11-14
recorded_by = "J.W. Jonkers"
role = "specifier"
verified = true
note = "Cross-read with xEdit Core/wbDefinitionsCommon.pas wbLandColors at revision 3ccc9e7d733becfcc97940cf0c877fa3d6213c5b (MPL-2.0): 33 rows of 33 structs of u8 red, green, blue. Second reader 2026-11-14: re-derived without the implementation: re-read from the UESP LAND page and xEdit wbLandColors; agrees."

[[source]]
id = "land-layer-header"
fact = "BTXT (base texture) and ATXT (additional texture) subrecords of LAND are 8 bytes each: u32 LTEX FormID (may be null), u8 quadrant (0 south-west, 1 south-east, 2 north-west, 3 north-east), one unused byte, s16 layer number. Up to four BTXT exist per LAND record, one per quadrant; each ATXT is followed by the VTXT of that quadrant and layer."
url = "https://en.uesp.net/wiki/Tes4Mod:Mod_File_Format/LAND"
licence = "CC-BY-SA-2.5 (UESP wiki footer: 'Attribution-ShareAlike 2.5 License'; page last edited 3 August 2024)"
date = 2026-11-14
recorded_by = "J.W. Jonkers"
role = "specifier"
verified = true
note = "UESP calls the FormID big-endian and the layer an unsigned short; xEdit (Core/wbDefinitionsCommon.pas wbLandLayers at revision 3ccc9e7d733becfcc97940cf0c877fa3d6213c5b, MPL-2.0) reads FormID, u8 quadrant, one unused byte and s16 layer, which is used here. FormIDs are read little endian like every other FormID in a record (plugin-record-header). Second reader 2026-11-14: re-derived without the implementation: re-read from the UESP LAND page and xEdit wbLandLayers (BTXT and ATXT structs); agrees."

[[source]]
id = "land-vtxt-layout"
fact = "The VTXT subrecord of LAND is a run of 8-byte points for the preceding ATXT: u16 position (0 to 288, the index in the quadrant's 17 x 17 grid filled row by row from the bottom-left point), two unused bytes, f32 opacity (0.0 to 1.0)."
url = "https://en.uesp.net/wiki/Tes4Mod:Mod_File_Format/LAND"
licence = "CC-BY-SA-2.5 (UESP wiki footer: 'Attribution-ShareAlike 2.5 License'; page last edited 3 August 2024)"
date = 2026-11-14
recorded_by = "J.W. Jonkers"
role = "specifier"
verified = false
note = "xEdit wbLandLayers (same revision, MPL-2.0) reads u16 position, two unused bytes and a float opacity. Corrected 2026-11-19: the fact used to end 'Positions not listed have no opacity (zero)', which neither source states. PROJECT CHOICE: decode_vtxt gives every position that no point lists an opacity of zero, and the diffuse blend uses that. OPEN: what the game does with a position no point lists. MEASURED 2026-11-20 (#155): 76046 layers, 192 list all 289 positions, 75854 list fewer (minimum 1), no listed entry has opacity 0.0 and no position is listed twice. Layers are sparse in practice, so the project choice (unlisted position = 0) matters for 99.7 percent of layers; the game's own treatment of an unlisted position is not measured."

[[source]]
id = "land-quadrant-grid"
fact = "A LAND cell has four quadrants, each a 17 x 17 point grid; quadrants share the middle row and column of the 33 x 33 vertex grid, so quadrant q starts at vertex column (q mod 2) x 16 and row (q div 2) x 16, rows counted from the south."
url = "https://en.uesp.net/wiki/Tes4Mod:Mod_File_Format/LAND"
licence = "CC-BY-SA-2.5 (UESP wiki footer: 'Attribution-ShareAlike 2.5 License'; page last edited 3 August 2024)"
date = 2026-11-14
recorded_by = "J.W. Jonkers"
role = "specifier"
verified = true
note = "The page gives the quadrant numbering, the 17 x 17 grid and the bottom-left-first row order; the mapping to vertex coordinates is arithmetic on those facts (two 16-interval halves of a 32-interval cell). Second reader 2026-11-14: re-derived without the implementation: quadrant numbering and 17 x 17 grid re-read from the UESP LAND page; 17 + 16 = 33 checked; agrees."

[[source]]
id = "ltex-texture-set"
fact = "In Fallout 3 and New Vegas a LTEX record has EDID, an optional ICON texture path, TNAM (FormID of a TXST texture set), HNAM havok data, SNAM specular exponent and GNAM grass FormIDs."
url = "https://github.com/TES5Edit/TES5Edit/blob/3ccc9e7d733becfcc97940cf0c877fa3d6213c5b/Core/wbDefinitionsFNV.pas"
licence = "MPL-2.0 (xEdit, TES5Edit/TES5Edit at revision 3ccc9e7d733becfcc97940cf0c877fa3d6213c5b)"
date = 2026-11-14
recorded_by = "J.W. Jonkers"
role = "specifier"
verified = true
note = "Read RegisterRecordDef(LTEX, ...) in wbDefinitionsFNV.pas. The Oblivion page https://en.uesp.net/wiki/Tes4Mod:Mod_File_Format/LTEX (CC-BY-SA-2.5) lists ICON as the texture path and has no TNAM. OPEN: which of TNAM and ICON the game prefers when both exist; the resolver takes the texture set's TX00 first and falls back to ICON. Second reader 2026-11-14: re-derived without the implementation: re-read from xEdit RegisterRecordDef(LTEX); agrees."

[[source]]
id = "txst-texture-paths"
fact = "A FNV TXST record has EDID, OBND, then optional zero-terminated texture paths TX00 (base image), TX01 (normal map, specular in alpha), TX02 (environment map mask), TX03 (glow map), TX04 (parallax map) and TX05 (environment map), DODT decal data and DNAM flags."
url = "https://github.com/TES5Edit/TES5Edit/blob/3ccc9e7d733becfcc97940cf0c877fa3d6213c5b/Core/wbDefinitionsFNV.pas"
licence = "MPL-2.0 (xEdit, TES5Edit/TES5Edit at revision 3ccc9e7d733becfcc97940cf0c877fa3d6213c5b)"
date = 2026-11-14
recorded_by = "J.W. Jonkers"
role = "specifier"
verified = true
note = "Read RegisterRecordDef(TXST, ...) in wbDefinitionsFNV.pas. Whether the paths are relative to the textures folder is not stated; the code keeps them as stored. Second reader 2026-11-14: re-derived without the implementation: re-read from xEdit RegisterRecordDef(TXST); agrees."

[[source]]
id = "plugin-record-override"
fact = "A plugin overrides a record of an earlier plugin (its master) by carrying a record with the same (resolved) FormID: that shared FormID is how the game knows the later data object replaces the master's. The page does not say whether the replacement is of the whole record or field by field."
url = "https://en.uesp.net/wiki/Tes4Mod:FormID"
licence = "CC-BY-SA-2.5 (UESP wiki footer: 'Attribution-ShareAlike 2.5 License')"
date = 2026-11-14
recorded_by = "J.W. Jonkers"
role = "specifier"
verified = false
note = "The page says a record that reuses a master's FormID 'is how the game knows that your data object is replacing the data object' of the master (quoted by the specifier and the second reader on 2026-11-14; the page answered HTTP 403 to an automated read on 2026-11-19 and was not re-read then). Corrected 2026-11-19: the fact used to add 'replaces the earlier one as a whole', which no source read states. PROJECT CHOICE, not a recorded fact: lodwright applies whole-record replacement (the last plugin in load order that carries the FormID supplies every field of LTEX, TXST, LAND and WRLD; no field-level merging is done). OPEN: whether the game does the same; settled by a public source with a stated licence or by an owner oracle check (see LOG.md). MEASURED 2026-11-20 (#155): 7 of 42467 LAND records are overridden, all FalloutNV.esm to LonesomeRoad.esm, each with the same subrecord-type set as its master, so whole replacement and field merging cannot be told apart on stock data. The OPEN question stays open for plugins that carry fewer subrecords than their master; no source for it was found (#53)."

[[source]]
id = "wrld-parent"
fact = "A FNV WRLD record names its parent worldspace in WNAM (a WRLD FormID) and carries PNAM, a u16 of flags telling what the child takes from the parent: bit 0 land data, bit 1 LOD data, bit 2 map data, bit 3 water data, bit 4 climate data, bit 5 image space data."
url = "https://github.com/TES5Edit/TES5Edit/blob/3ccc9e7d733becfcc97940cf0c877fa3d6213c5b/Core/wbDefinitionsFNV.pas"
licence = "MPL-2.0 (xEdit, TES5Edit/TES5Edit at revision 3ccc9e7d733becfcc97940cf0c877fa3d6213c5b)"
date = 2026-11-14
recorded_by = "J.W. Jonkers"
role = "specifier"
verified = true
note = "Read RegisterRecordDef(WRLD, ...): the 'Parent Worldspace' struct with WNAM and the PNAM flags 'Use Land Data', 'Use LOD Data', 'Use Map Data', 'Use Water Data', 'Use Climate Data', 'Use Image Space Data'. The UESP Oblivion page https://en.uesp.net/wiki/Tes4Mod:Mod_File_Format/WRLD (CC-BY-SA-2.5) lists WNAM as the parent and has no PNAM. Second reader 2026-11-14: re-derived without the implementation: re-read from xEdit RegisterRecordDef(WRLD), Parent Worldspace struct; agrees."

[[source]]
id = "wrld-land-data"
fact = "A FNV WRLD record's DNAM subrecord ('Land Data') is two f32 values: the default land height, then the default water height."
url = "https://github.com/TES5Edit/TES5Edit/blob/3ccc9e7d733becfcc97940cf0c877fa3d6213c5b/Core/wbDefinitionsCommon.pas"
licence = "MPL-2.0 (xEdit, TES5Edit/TES5Edit at revision 3ccc9e7d733becfcc97940cf0c877fa3d6213c5b)"
date = 2026-11-14
recorded_by = "J.W. Jonkers"
role = "specifier"
verified = true
note = "Read wbWorldLandData in wbDefinitionsCommon.pas. xEdit shows the default land height with default -2048 for these games; the unit and whether 'default water height' is in world units are not stated. Second reader 2026-11-14: re-derived without the implementation: re-read from xEdit wbWorldLandData; agrees."

[[source]]
id = "wrld-bounds"
fact = "A FNV WRLD record's NAM0 and NAM9 subrecords are the minimum and maximum corner of the worldspace, each two f32 values (x, then y)."
url = "https://github.com/TES5Edit/TES5Edit/blob/3ccc9e7d733becfcc97940cf0c877fa3d6213c5b/Core/wbDefinitionsCommon.pas"
licence = "MPL-2.0 (xEdit, TES5Edit/TES5Edit at revision 3ccc9e7d733becfcc97940cf0c877fa3d6213c5b)"
date = 2026-11-14
recorded_by = "J.W. Jonkers"
role = "specifier"
verified = false
note = "Read wbWorldObjectBounds, which the FNV WRLD definition uses (Core/wbDefinitionsFNV.pas, RegisterRecordDef(WRLD, ...)). The UESP Oblivion page describes NAM0 and NAM9 for Oblivion as 'long[2]' (cell coordinates): integers in another game, which says nothing about the unit of FNV's floats. xEdit declares each coordinate as IsSF1(wbFloat(..., 1/100), wbFloat(..., 1/4096)); TwbGameDef.IsSF1 (Core/wbInterface.pas line 7377) returns its first argument only when the game is Starfield, so for FO3 and FNV the float's scale is 1/4096 and 1/100 is the Starfield branch (corrected 2026-11-19; the earlier note had the two the wrong way round). TwbFloatDef.ToValue multiplies the stored value by that scale and TwbFloatDef.FromValue divides an entered value by it (Core/wbInterface.pas), so xEdit shows (and accepts) an FNV bound as the stored f32 divided by 4096; the stored bytes are the plain f32. OPEN: the unit of the stored floats. A display divided by 4096 (the cell size, cell-size-units) suggests world units shown as cells, but no source states the unit; reading NAM0 and NAM9 of an owner plugin next to the cell grid of the same world (numbers only) settles it. The reader keeps the stored values; in this repository nothing that generates LOD reads them (only the accessor Worldspace::declared_bounds and its test). MEASURED 2026-11-20 (#155, numbers only, FalloutNV.esm and four DLC plugins, 30 worldspaces): the stored NAM0 and NAM9 floats are world units, multiples of 4096 (one cell); the Strip's -131072..131072 equals LAND cells -32..31 exactly; the bounds contain or exceed the LAND cell range everywhere. This answers the unit as a measurement on stock data; the row stays false until a second reader (#158)."

[[source]]
id = "cell-water"
fact = "A CELL has DATA flags (0x02 = has water) and an optional XCLW f32 water height; xEdit's after-load for FNV adds an XCLW with the value 'Default' to a has-water cell that lacks one."
url = "https://en.uesp.net/wiki/Tes4Mod:Mod_File_Format/CELL"
licence = "CC-BY-SA-2.5 (UESP wiki footer: 'Attribution-ShareAlike 2.5 License'; page last edited 30 July 2024), and MPL-2.0 for the xEdit part"
date = 2026-11-14
recorded_by = "J.W. Jonkers"
role = "specifier"
verified = true
note = "UESP: 'DATA ubyte[1] flags: 0x02 = Has water' and 'XCLW float: Water height (if not 0.00)'. xEdit wbDefinitionsFNV.pas (revision 3ccc9e7d733becfcc97940cf0c877fa3d6213c5b, MPL-2.0) declares wbFloat(XCLW, 'Water Height') and the after-load that adds XCLW 'Default' when DATA and 2 is set. OPEN: what 'Default' resolves to; the reader assumes the worldspace default water height. Second reader 2026-11-14: re-derived without the implementation: re-read from the UESP CELL page and xEdit (CELL DATA flags, XCLW, wbCELLAfterLoad); agrees."

[[source]]
id = "wrld-child-inherits"
fact = "In Oblivion (the UESP page has no PNAM) a child worldspace inherits climate, water and map data from its parent named in WNAM."
url = "https://en.uesp.net/wiki/Tes4Mod:Mod_File_Format/WRLD"
licence = "CC-BY-SA-2.5 (UESP wiki footer: 'Attribution-ShareAlike 2.5 License'; page last edited 30 July 2024)"
date = 2026-11-14
recorded_by = "J.W. Jonkers"
role = "specifier"
verified = false
note = "Corrected 2026-11-19: the fact used to merge this Oblivion statement with the FNV PNAM flags of xEdit ('the flags say which groups of data a child takes'), which neither source states. The xEdit claim is its own row, wrld-parent (FNV PNAM flags 'Use Land Data', 'Use LOD Data', 'Use Map Data', 'Use Water Data', 'Use Climate Data', 'Use Image Space Data'). OPEN: whether a FNV child inherits anything when a flag is clear, and whether a set flag means the child takes that data from its parent. No public source read says that a child worldspace uses its parent's LAND cells, or what the game does for LOD with a flagged parent. OPEN QUESTION, recorded in docs/design.md. PROJECT CHOICE: the conservative rule (no inheritance) is the default; the option FlaggedDefaults only lets a child with the 'use land data' flag take the parent's default land and water height (the DNAM struct that xEdit names 'Land Data'). MEASURED 2026-11-20 (#155): 17 child worldspaces in the master and DLC plugins; all have PNAM 0x4 (map-data bit only, land and LOD bits clear), all carry LAND records of their own (9 to 4096 each), and the game's own LOD tree has blocks for every one of them. No stock child sets the land or LOD bit, so the question what a set bit means is not decided by this data."

[[source]]
id = "nif-header-magic-version"
fact = "A NIF starts with the text line 'Gamebryo File Format, Version 20.2.0.7' ended by a line feed (0x0A), then the version as a u32 (0x14020007). The NetImmerse magic is the alternative first line for older files and is not handled."
url = "https://github.com/TES5Edit/TES5Edit/blob/3ccc9e7d733becfcc97940cf0c877fa3d6213c5b/Core/wbDataFormatNif.pas"
licence = "MPL-2.0 (file header; TES5Edit/TES5Edit at revision 3ccc9e7d733becfcc97940cf0c877fa3d6213c5b)"
date = 2026-11-14
recorded_by = "J.W. Jonkers"
role = "specifier"
verified = true
note = "NiHeader definition: Magic (terminator 0x0A) and Version (u32, default 20.2.0.7); TwbNifFile.UnSerialize checks the magic constant sNifMagicGamebryo."

[[source]]
id = "nif-header-fields"
fact = "After the version: endian type (u8, 1 = little endian, present since 20.0.0.4), user version (u32, since 10.0.1.8), block count (u32); then, when the version is 20.2.0.7 and the user version is 3 or more, user version 2 (u32) and the export info: author (short string), an unknown u32 only when user version 2 is above 130, process script (short string) only when user version 2 is below 131, export script (short string), max file path (short string) only when user version 2 is 103 or more. A short string is a u8 length then that many bytes."
url = "https://github.com/TES5Edit/TES5Edit/blob/3ccc9e7d733becfcc97940cf0c877fa3d6213c5b/Core/wbDataFormatNif.pas"
licence = "MPL-2.0 (file header; TES5Edit/TES5Edit at revision 3ccc9e7d733becfcc97940cf0c877fa3d6213c5b)"
date = 2026-11-14
recorded_by = "J.W. Jonkers"
role = "specifier"
verified = true
