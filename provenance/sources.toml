verified = false

[[source]]
id = "lod-block-naming"
fact = "A terrain LOD block of level L covers L x L cells and is named by the world's editor id, the level and the cell coordinates of its south-west cell (a multiple of L, negative values allowed): <World>.<level>.<x>.<y>."
url = "oracle:lod-output-tree"
licence = "Facts about file names in the owner's own xLODGen output; no file content is recorded"
date = 2026-11-14
recorded_by = "J.W. Jonkers"
role = "specifier"
verified = false
note = "Recorded from the owner's research notes; to be checked against the owner's output tree with the planned verify command. Public sources (fnv-lod-object-block-names, fnv-lod-terrain-names) give <World>.level<L>.x<X>.y<Y>.nif instead: treat this row as superseded until the owner's tree decides."

[[source]]
id = "lod-terrain-paths"
fact = "Terrain LOD meshes are <World>.<level>.<x>.<y>.btr in meshes/landscape/lod/<World>/blocks/; terrain LOD textures are the same name with .dds (diffuse) and _n.dds before the extension (normal) in textures/landscape/lod/<World>/blocks/."
url = "oracle:lod-output-tree"
licence = "Facts about file names in the owner's own xLODGen output; no file content is recorded"
date = 2026-11-14
recorded_by = "J.W. Jonkers"
role = "specifier"
verified = false
note = "Same origin and the same open check as lod-block-naming. The exact suffix of the normal map is the least certain part. Public sources contradict it: the extension is .nif, not .btr, and the normal map is <World>.n.level<L>... (fnv-lod-terrain-names, fnv-lod-block-container-nif); superseded until the owner's tree decides."

